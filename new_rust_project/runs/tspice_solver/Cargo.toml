[package]
name = "tspice_solver"
version = { workspace = true }
edition = { workspace = true }
description = "Вычислительное ядро TSPICE Laboratory (3D FEM, Quantum-Poisson, Reduced PDE, Memory ODE, Extraction, Verification, Hybrid Runtime, CAD IO)"
authors = { workspace = true }

[lib]
name = "tspice_solver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "tspice_solver_tests"
path = "tests/tspice_solver_tests.rs"

[features]
default = []
# Включение PyO3-моста для Python-интерфейса (maturin develop --features python)
python = ["dep:pyo3", "dep:ndarray", "dep:numpy"]
# Включение ONNX Runtime тёплого старта (NFR-PERF-03) для Python-моста
onnx = ["python", "dep:ort"]

[dependencies]
# Python bridge (опционально — вне основного .exe, согласно NFR-PORT-01)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
ndarray = { version = "0.15", optional = true }
numpy = { version = "0.22", optional = true }
ort = { version = "2.0.0-rc.4", features = ["ndarray"], optional = true }

# Сериализация отчётов и SPICE/JSON-карт (domain/io)
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"

[package]
name = "tspice_lab"
version = "0.1.0"
edition = "2021"
description = "TSPICE Laboratory Workbench — нативный GUI на egui/eframe"
authors = ["TSPICE Laboratory"]

[[bin]]
name = "tspice_lab"
path = "src/main.rs"

[dependencies]
tspice_ui = { path = "src/ui" }
eframe = "0.27"
egui = "0.27"

[dev-dependencies]
tspice_solver = { path = "src/power_solver" }

[workspace]
members = ["src/power_solver", "src/ui"]
resolver = "2"

[package]
name = "tspice_solver"
version = "0.1.0"
edition = "2021"
description = "Вычислительное ядро TSPICE Laboratory (3D FEM, Quantum-Poisson, Reduced PDE, Memory ODE, Extraction, Verification, ONNX Surrogates, Hybrid Runtime)"
authors = ["TSPICE Laboratory Team"]

[lib]
name = "tspice_solver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "tspice_solver_tests"
path = "tests/tspice_solver_tests.rs"

[dependencies]
# Python / Django bridge (PyO3 + NumPy zero-copy)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"

# Тензоры, линейная алгебра и разреженные матрицы CSR/CSC
ndarray = { version = "0.15", features = ["rayon", "serde"] }
sprs = "0.11"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-traits = "0.2"

# Инференс нейросетевых суррогатов (U-Net / GNN) через ONNX Runtime
ort = { version = "2.0.0-rc.4", features = ["ndarray"] }

# Многопоточность CPU для батчевых решателей и сборки матриц
rayon = "1.10"

# Сериализация конфигураций, отчётов, диагностик и SPICE/JSON-карт
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Типизированные доменные ошибки (RFC 7807 / NFR-REL-03)
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

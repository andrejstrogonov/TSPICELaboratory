      type: object
      description: |
        Reduced-order PDE (A-3): семейства ВАХ/ВФХ по модели плавного канала
        (`Cgg = dQg/dVg`). Используется как быстрый предварительный расчёт перед
        экстракцией (FR-EXT-06, этап 1).
      required:
      - structure_id
      properties:
        structure_id:
          type: integer
          format: int64
        drain_linear_v:
          type: number
          format: double
          default: 0.05
        drain_saturation_v:
          type: number
          format: double
          default: 0.8
        drain_output_max_v:
          type: number
          format: double
          default: 0.8
        gate_min_v:
          type: number
          format: double
          default: -0.5
        gate_max_v:
          type: number
          format: double
          default: 1.2
        gate_points:
          type: integer
          minimum: 3
          maximum: 1001
          default: 31
        drain_points:
          type: integer
          minimum: 2
          maximum: 501
          default: 25
        channel_points:
          type: integer
          minimum: 3
          maximum: 501
          default: 17
        poisson_nodes:
          type: integer
          minimum: 3
          maximum: 1001
          default: 61
        use_gpu:
          type: boolean
          default: true
        store_curves:
          type: boolean
          default: true
    GeneratedCurve:
      type: object
      description: |
        Сгенерированная характеристика. `kind` соответствует `characteristic_specs`,
        а `columns` содержит дополнительные оси (например, `drain_voltage` для
        семейства выходных ВАХ).
      required:
      - kind
      - x
      - y
      properties:
        kind:
          type: string
          examples:
          - idvg
        x:
          type: array
          items:
            type: number
            format: double
        y:
          type: array
          items:
            type: number
            format: double
        label:
          type: string
        columns:
          type: object
          description: Дополнительные величины по точкам кривой.
          additionalProperties:
            type: array
            items:
              type: number
              format: double
        points:
          type: integer
    PdeCharacteristicsResponse:
      type: object
      required:
      - task_id
      - backend_used
      - curves
      properties:
        task_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        backend_used:
          $ref: '#/components/schemas/ComputeBackend'
        model_description:
          type: string
          description: Текстовое описание используемой reduced-order модели.
        curves:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedCurve'
        diagnostics:
          type: object
          description: Служебные показатели модели (шаги по Vg/Vd, ёмкости, токи).
          additionalProperties:
            type: number
            format: double
        elapsed_s:
          type: number
          format: double
    MemoryCharacteristicsRequest:
      type: object
      description: |
        State-модель памяти (A-4): Струков / Biolek с rate-dependent окном,
        релаксацией и модуляцией канала по x(t).
      required:
      - structure_id
      properties:
        structure_id:
          type: integer
          format: int64
        voltage_min_v:
          type: number
          format: double
          default: -1
        voltage_max_v:
          type: number
          format: double
          default: 1
        drain_voltage_v:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 0.1
          description: Напряжение стока (для мемтранзистора).
        points_per_sweep:
          type: integer
          minimum: 11
          maximum: 20001
          default: 201
        temperature_k:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 300
    MemoryCharacteristicsResponse:
      type: object
      required:
      - task_id
      - curves
      properties:
        task_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        backend_used:
          $ref: '#/components/schemas/ComputeBackend'
        model_description:
          type: string
        curves:
          type: array
          description: |
            `memristor_iv`, `memristor_resistance`, `memory_idvg` — см.
            characteristic_specs; `columns.state` содержит траекторию x(t).
          items:
            $ref: '#/components/schemas/GeneratedCurve'
        hysteresis_area_av:
          type: number
          format: double
          description: Площадь петли гистерезиса, А·В (0 — модель выродилась в линию).
        state_swing:
          type: number
          format: double
          description: Размах состояния памяти x ∈ [0, 1].
        diagnostics:
          type: object
          additionalProperties:
            type: number
            format: double
    CharacteristicsBatchRequest:
      type: object
      description: |
        Пакетный расчёт полного набора характеристик семейства одной задачей
        (используется экраном «Характеристики»).
      required:
      - structure_id
      properties:
        structure_id:
          type: integer
          format: int64
        spec_ids:
          type: array
          description: Требуемые характеристики (по умолчанию — все доступные семейству).
          items:
            type: string
        sweep:
          $ref: '#/components/schemas/PdeCharacteristicsRequest'
        store_curves:
          type: boolean
          default: true
    CharacteristicsBatchResponse:
      type: object
      required:
      - structure_id
      - characteristic_sets
      properties:
        structure_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        backend_used:
          $ref: '#/components/schemas/ComputeBackend'
        characteristic_sets:
          type: array
          items:
            type: object
            required:
            - spec_id
            - curves
            properties:
              spec_id:
                type: string
              x_axis_field:
                type: string
              y_axis_field:
                type: string
              scale_type:
                type: string
              curves:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratedCurve'
    AxisLabel:
      type: object
      description: Определение оси из справочника axis_labels (41 запись).
      required:
      - label_id
      - display_name
      properties:
        label_id:
          type: string
          examples:
          - gate_voltage
        display_name:
          type: string
          examples:
          - Напряжение затвора (В)
        unit:
          type: string
          examples:
          - V
    CharacteristicSpec:
      type: object
      description: Определение характеристики из справочника characteristic_specs (41 запись).
      required:
      - spec_id
      - display_name
      - x_axis_field
      - y_axis_field
      - scale_type
      properties:
        spec_id:
          type: string
          examples:
          - idvg
        display_name:
          type: string
          examples:
          - MOSFET / FET · Id–Vg
        x_axis_field:
          type: string
          examples:
          - gate_voltage
        y_axis_field:
          type: string
          examples:
          - drain_current
        x_axis:
          $ref: '#/components/schemas/AxisLabel'
        y_axis:
          $ref: '#/components/schemas/AxisLabel'
        scale_type:
          type: string
          enum:
          - log
          - linear
          - logx
        required_signals:
          type: string
          description: Минимально необходимые колонки данных (characteristic_requirements).
          examples:
          - Vg, Id [и Vd]
        applicable_families:
          type: array
          items:
            $ref: '#/components/schemas/DeviceFamily'
        selected_by_default:
          type: boolean
          description: Характеристика выбрана по умолчанию (selected-output-characteristics).
    CharacteristicSet:
      type: object
      description: Сохранённый набор кривых по характеристике (для перерисовки графиков).
      required:
      - spec_id
      - curves
      properties:
        set_id:
          type: integer
          format: int64
        spec_id:
          type: string
        spec:
          $ref: '#/components/schemas/CharacteristicSpec'
        task_id:
          type: integer
          format: int64
        structure_id:
          type: integer
          format: int64
        curves:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedCurve'
        created_at:
          type: string
          format: date-time
    MeshEstimateRequest:
      type: object
      required:
      - structure_id
      properties:
        structure_id:
          type: integer
          format: int64
        mesh:
          $ref: '#/components/schemas/MeshRequest'
    MemoryEstimate:
      type: object
      description: |
        Оценка бюджета до запуска расчёта (FR-CORE-01, NFR-REL-03). GUI показывает
        предупреждение, если `fits_vram` ложно.
      required:
      - node_count
      - tet_count
      - estimated_memory_mb
      - fits_vram
      properties:
        grid_shape:
          type: array
          items:
            type: integer
        node_count:
          type: integer
        tet_count:
          type: integer
        estimated_matrix_mb:
          type: number
          format: double
        estimated_memory_mb:
          type: number
          format: double
        available_ram_mb:
          type: number
          format: double
        available_vram_mb:
          type: number
          format: double
        fits_vram:
          type: boolean
        fits_ram:
          type: boolean
        recommended_backend:
          $ref: '#/components/schemas/ComputeBackend'
        budget_exceeded:
          type: boolean
          description: true — превышен лимит узлов MAX_MESH_NODES.
        warning:
          type: string
    GeometryFieldDefinition:
      type: object
      description: Определение поля геометрии из справочника geometry_fields (33 записи).
      required:
      - field_id
      - display_name
      - default_value
      - min_value
      - max_value
      - unit
      properties:
        field_id:
          type: string
          examples:
          - fin_width_nm
        display_name:
          type: string
          examples:
          - Ширина fin
        default_value:
          type: number
          format: double
        min_value:
          type: number
          format: double
        max_value:
          type: number
          format: double
        unit:
          type: string
          examples:
          - ' нм'
        value_kind:
          type: string
          description: Ожидаемый тип значения (целые счётчики count_* валидируются строже).
          enum:
          - length
          - voltage
          - doping
          - density
          - mobility
          - energy
          - resistance
          - time
          - dimensionless
          - count
        device_families:
          type: array
          description: Семейства, для которых поле обязательно.
          items:
            $ref: '#/components/schemas/DeviceFamily'
        required:
          type: boolean
          description: Обязательно ли поле для своего семейства.
        invariant:
          type: string
          description: Доменный инвариант, проверяемый сервером (DeviceParameters.validate).
          examples:
          - fin_pitch_nm >= fin_width_nm
    GeometryFieldValue:
      type: object
      description: Значение поля геометрии экземпляра структуры (EAV-строка).
      required:
      - field_id
      - value
      properties:
        field_id:
          type: string
          examples:
          - fin_height_nm
        value:
          type: number
          format: double
          description: |
            Числовое значение в единицах поля (`geometry_fields.unit`).
            Счётчики (`fin_count`, `sheet_count`, `wire_count`) обязаны быть целыми.
        unit:
          type: string
          description: Единица поля (переопределять не рекомендуется).
        source:
          type: string
          description: Происхождение значения.
          enum:
          - default
          - user
          - imported
          - derived
    Material:
      type: object
      description: Материал слоя (справочник материалов).
      required:
      - material_id
      - name
      - epsilon_r
      properties:
        material_id:
          type: integer
          format: int64
        name:
          type: string
          examples:
          - AlGaN/GaN
        epsilon_r:
          type: number
          format: double
          description: Относительная диэлектрическая проницаемость.
        mobility_n:
          type: number
          format: double
          description: Подвижность электронов, см²/(В·с).
        mobility_p:
          type: number
          format: double
          description: Подвижность дырок, см²/(В·с).
        bandgap_ev:
          type: number
          format: double
          description: Ширина запрещённой зоны, эВ.
        k_thermal:
          type: number
          format: double
          description: Коэффициент теплопроводности, Вт/(м·К).
        role:
          type: string
          description: Роль материала в структуре.
          enum:
          - channel
          - oxide
          - barrier
          - substrate
          - electrode
          - active_layer
    StlGeometry:
      type: object
      description: Результат разбора STL — габариты и треугольники в нанометрах.
      required:
      - vertices
      - triangles
      properties:
        vertices:
          type: array
          description: Уникальные вершины, нм.
          maxItems: 2000000
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
              format: double
        triangles:
          type: array
          description: Индексы вершин треугольников.
          maxItems: 2000000
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: integer
              minimum: 0
        triangle_count:
          type: integer
          minimum: 0
        bounds:
          type: object
          description: Габариты в нм.
          required:
          - min
          - max
          properties:
            min:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
                format: double
            max:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
                format: double
        format:
          type: string
          enum:
          - binary
          - ascii
    Profile:
      type: object
      description: |
        Профиль семейства — конфигурация расчёта и экспорта (таблица
        —конфигурация расчёта и экспорта (таблица
        `device_profiles`). Версионируется полем `revision`.
      required:
      - profile_id
      - device_id
      - name
      - solver_basis
      - export_format
      allOf:
      - type: object
        required:
        - profile_id
        - device_id
        - name
        - solver_basis
        - export_format
        properties:
          profile_id:
            type: integer
            format: int64
          device_id:
            $ref: '#/components/schemas/DeviceFamily'
          name:
            type: string
            maxLength: 120
          solver_basis:
            type: string
            enum:
            - compact_model_fit
            - laplace_fem
            - geometric_fem
            - perimeter_fem
            - tunnel_field_fem
            - phenomenological_thermal_fem
            - state_model_ode
            - cad_mapping
          export_format:
            type: string
            enum:
            - bsim4_model
            - level72_model
            - behavioral_subckt
            - verilog_a
            - curve_metrics_json
          thermal_enabled:
            type: boolean
          default_parameters:
            type: object
            additionalProperties:
              type: number
              format: double
          valid_from:
            type: string
            format: date-time
          revision:
            type: integer
            minimum: 1
            description: Версия профиля (растёт при PATCH; используется в If-Match).
          is_default:
            type: boolean
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    PhysicalParameters:
      type: object
      description: Базовые физические константы расчёта (инварианты DeviceParameters).
      required:
      - epsilon_r
      - electron_mobility
      - hole_mobility
      - bandgap
      - doping
      - tox_nm
      - length_um
      properties:
        epsilon_r:
          type: number
          format: double
          exclusiveMinimum: 0
        electron_mobility:
          type: number
          format: double
          exclusiveMinimum: 0
          description: см²/(В·с)
        hole_mobility:
          type: number
          format: double
          exclusiveMinimum: 0
          description: см²/(В·с)
        bandgap:
          type: number
          format: double
          exclusiveMinimum: 0
          description: эВ
        doping:
          type: number
          format: double
          exclusiveMinimum: 0
          description: см⁻³
        tox_nm:
          type: number
          format: double
          exclusiveMinimum: 0
        width_um:
          type: number
          format: double
          exclusiveMinimum: 0
        length_um:
          type: number
          format: double
          exclusiveMinimum: 0
        temperature_k:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 300
        barrier_material:
          type: string
          description: Материал барьера (HEMT).
        junction_material:
          type: string
          description: Материал перехода (TFET).
    DeviceStructure:
      type: object

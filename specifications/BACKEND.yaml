openapi: 3.1.0
info:
  title: TSPICE Laboratory API
  summary: Сквозное моделирование полупроводниковых структур и экстракция компактных моделей
  description: |
    Серверный контракт платформы TSPICE Laboratory: справочники приборов, экземпляры
    структур (включая CAD-импорт STL), вычислительное ядро FEM/quantum-Poisson,
    сгенерированные характеристики, экстракция параметров компактных моделей,
    верификация в EDA (ngspice / Micro-Cap / OpenVAF), отчётность и AI-платформа
    суррогатных моделей.

    ## Принципы
    * **Гибридный решатель.** Нейросеть даёт только стартовый вектор; физическую
      точность результата всегда определяет детерминированный решатель
      (Rust/FEM/SciPy). Поэтому ответы расчётов содержат `backend_used`,
      `warm_start` и `fallback_to_fem`.
    * **Дифференцированный экспорт.** Полная SPICE-карта BSIM4 выдаётся только для
      планарного bulk MOSFET (FR-EXP-01); для остальных семейств ответ содержит
      `curve_metrics`.
    * **Двухэтапная экстракция и loopback.** Предварительный фиттинг выполняется
      внутренней библиотекой, финальные параметры и верификация — только по данным
      сквозного прогона нетлиста (FR-EXT-06, FR-EXT-07).
    * **Долгие операции асинхронны.** Запуск расчёта, экстракции, верификации и
      обучения AI возвращает `202` и ресурс со статусом; прогресс — через
      SSE-поток `/jobs/{job_id}/events`, результат — через результат сессии.

    ## Формат ошибок
    Все ошибки возвращаются в формате RFC 7807 (`application/problem+json`) с
    машинным `code` из перечисления `ErrorCode` и заголовком `X-Request-Id`.

    ## Маршрутизация к семействам приборов
    Десять семейств (`DeviceFamily`) различаются набором полей геометрии
    (`geometry`), методом расчёта и форматом экспорта — см. `DeviceCapabilities`.
  version: 1.0.0
  contact:
    name: TSPICE Laboratory
  license:
    name: Proprietary
servers:
- url: http://windows-server:8000/api/v1
  description: Расчётная станция (Windows GPU / Jenkins-доставка)
- url: http://localhost:8000/api/v1
  description: Локальная разработка (django-app)
- url: '{protocol}://{host}:{port}/api/v1'
  description: Произвольный стенд (переменные используются шаблонами SDK)
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    host:
      default: windows-server
    port:
      default: '8000'
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Catalog
  description: |
    Справочники D0 (только чтение): семейства приборов, поля геометрии,
    оси, характеристики, метрики, материалы, решатели, диапазоны значений
    для GUI-форм. Источник — django-app/src/sql.
- name: Devices
  description: |
    D1 · Configuration: профили, экземпляры структур, EAV-значения полей,
    CAD-импорт STL, экспорт/импорт полного набора параметров (FR-IMP-02/03).
- name: Compute
  description: |
    D1 · Computation: FEM-задачи (тепло FR-CORE-02, электрика FR-CORE-03,
    индукция FR-CORE-04), quantum-Poisson, reduced-order PDE, state-модели
    памяти, карты полей, журнал сходимости, выбор backend'а (FR-CORE-05).
- name: Extraction
  description: |
    D1 · Extraction: наборы измерений, стартовые приближения по крутизне
    (FR-EXT-01), многопараметрический фиттинг (FR-EXT-02), пошаговый BSIM4
    (FR-EXT-04), curve metrics, SPICE-карты и дифференцированный экспорт
    (FR-EXP-01), загрузка CSV (FR-IMP-01).
- name: Verification
  description: |
    D1 · Verification: компиляция Verilog-A (OpenVAF), сквозной прогон в
    ngspice/Micro-Cap (FR-EXT-06), loopback-самотестирование (FR-EXT-07),
    валидация гистерезиса мемристоров (FR-EXT-05).
- name: Reports
  description: Генерация LaTeX-отчёта и выгрузка PDF (NFR-USA-01).
- name: Telemetry
  description: Телеметрия GPU и узлов (FR-GUI-03), профили mesh-бюджета.
- name: AI
  description: |
    D1 · AI Platform: реестр суррогатных моделей (U-Net/GNN), обучение,
    инференс warm start, ONNX-экспорт и проверки-гейты (NFR-PERF-03,
    NFR-REL-04, ФТ.5.1–5.4 / НФТ.5.1–5.4).
- name: Integrations
  description: EDA-мосты и системные настройки подключения к симуляторам.
- name: System
  description: Журнал задач (jobs), поток прогресса SSE, health/readiness, версия контракта.
paths:
  /ai/surrogates:
    get:
      tags:
      - AI
      summary: Реестр суррогатных моделей
      operationId: listSurrogates
      parameters:
      - name: family
        in: query
        description: Назначение суррогата.
        required: false
        schema:
          $ref: '#/components/schemas/SurrogateFamily'
      - name: status
        in: query
        description: Состояние модели в реестре.
        required: false
        schema:
          type: string
          enum:
          - draft
          - validating
          - active
          - archived
          - failed
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница моделей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurrogateModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - AI
      summary: Зарегистрировать суррогатную модель
      description: |
        Создаёт запись в реестре в состоянии `draft`. Модель становится `active`
        только после прохождения гейтов (`/ai/surrogates/{surrogate_id}/gates`).
      operationId: registerSurrogate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurrogateModelCreate'
      responses:
        '201':
          description: Модель зарегистрирована.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurrogateModel'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /ai/surrogates/{surrogate_id}:
    get:
      tags:
      - AI
      summary: Суррогатная модель
      operationId: getSurrogate
      parameters:
      - $ref: '#/components/parameters/SurrogateModelIdPath'
      responses:
        '200':
          description: Запись реестра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurrogateModel'
        '404':
          $ref: '#/components/responses/NotFound'
  /ai/surrogates/{surrogate_id}/train:
    post:
      tags:
      - AI
      summary: Запустить обучение
      description: |
        Обучение на накопленных эталонных прогонах FEM (NFR-REL-04). Выполняется
        асинхронно; прогресс — через job events.
      operationId: startTraining
      parameters:
      - $ref: '#/components/parameters/SurrogateModelIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
      responses:
        '202':
          description: Обучение поставлено в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /ai/trainings:
    get:
      tags:
      - AI
      summary: Журнал прогонов обучения
      operationId: listTrainingRuns
      parameters:
      - name: surrogate_id
        in: query
        description: Фильтр по модели.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/StatusQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница прогонов обучения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRunList'
  /ai/trainings/{training_id}:
    get:
      tags:
      - AI
      summary: Прогон обучения
      operationId: getTrainingRun
      parameters:
      - $ref: '#/components/parameters/TrainingRunIdPath'
      responses:
        '200':
          description: Прогон с метриками по эпохам.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /ai/inference:
    post:
      tags:
      - AI
      summary: Пробный инференс warm start
      description: |
        Инференс суррогата без записи в задачу расчёта. С `compare_with_fem`
        возвращает невязку тёплого старта относительно точного FEM.
      operationId: runSurrogateInference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
      responses:
        '200':
          description: Результат инференса и сравнение с FEM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /ai/surrogates/{surrogate_id}/gates:
    get:
      tags:
      - AI
      summary: Отчёт о проверках-гейтах модели
      description: |
        Физическая невязка, монотонность ВАХ, C²-непрерывность и экономия
        итераций. Без пройденных гейтов модель не может стать `active`.
      operationId: getSurrogateGates
      parameters:
      - $ref: '#/components/parameters/SurrogateModelIdPath'
      responses:
        '200':
          description: Отчёт о гейтах.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGateReport'
        '404':
          $ref: '#/components/responses/NotFound'
  /ai/surrogates/{surrogate_id}/onnx:
    post:
      tags:
      - AI
      summary: Экспорт модели в ONNX
      description: |
        Выгружает модель для Rust-ядра (ONNX Runtime). Возвращает результат
        проверки паритета «ONNX ≈ PyTorch».
      operationId: exportSurrogateOnnx
      parameters:
      - $ref: '#/components/parameters/SurrogateModelIdPath'
      responses:
        '200':
          description: Результат экспорта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnnxExportResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /solver/fem:
    post:
      tags:
      - Compute
      summary: FEM-расчёт (тепло, электрика, индукция)
      description: |
        Запускает 3D FEM-задачу (FR-CORE-02/03/04). По умолчанию возвращает
        `202` с задачей в очереди; `Prefer: respond-async=false` включает
        синхронный экспресс-режим для коротких сеток. Суррогат даёт только
        стартовый вектор, точность обеспечивает детерминированный решатель.
      operationId: createFemCalculation
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FemCalculationRequest'
      responses:
        '200':
          description: Синхронный результат экспресс-расчёта.
          headers:
            X-RateLimit-Remaining:
              description: Остаток квоты запросов в текущем окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FemCalculationResponse'
        '202':
          description: Задача принята в очередь расчёта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FemCalculationAccepted'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /solver/quantum-poisson:
    post:
      tags:
      - Compute
      summary: Самосогласованный расчёт Пуассона–Шрёдингера
      description: |
        Reduced-order модель с эффективной массой и конфайнментом (не
        неравновесный TCAD). Асинхронный запуск, как и FEM.
      operationId: createQuantumPoissonCalculation
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantumPoissonRequest'
      responses:
        '200':
          description: Решение самосогласованной задачи (экспресс-режим).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumPoissonResponse'
        '202':
          description: Задача принята в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FemCalculationAccepted'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /solver/pde-characteristics:
    post:
      tags:
      - Compute
      summary: Характеристики по reduced-order PDE
      description: |
        Семейства ВАХ/ВФХ по модели плавного канала (`Cgg = dQg/dVg`) — быстрый
        предварительный расчёт перед экстракцией.
      operationId: createPdeCharacteristics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdeCharacteristicsRequest'
      responses:
        '200':
          description: Сгенерированные кривые.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdeCharacteristicsResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /solver/memory-characteristics:
    post:
      tags:
      - Compute
      summary: Кривые memristor / memtransistor
      description: |
        State-модель памяти: гистерезисные I–V, R–t и Id–Vg по модели с
        внутренним состоянием x(t) и порогами SET/RESET.
      operationId: createMemoryCharacteristics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCharacteristicsRequest'
      responses:
        '200':
          description: Кривые памяти и диагностика модели.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCharacteristicsResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /solver/characteristics/batch:
    post:
      tags:
      - Compute
      summary: Пакетный расчёт характеристик семейства
      description: Один запрос запускает весь набор характеристик структуры.
      operationId: createCharacteristicsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacteristicsBatchRequest'
      responses:
        '200':
          description: Наборы кривых по каждой характеристике.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacteristicsBatchResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /solver/mesh-estimate:
    post:
      tags:
      - Compute
      summary: Оценка бюджета сетки и памяти
      description: |
        Предварительная оценка числа узлов и памяти (FR-CORE-01, NFR-REL-03).
        GUI предупреждает пользователя, если расчёт не помещается в VRAM.
      operationId: estimateMeshBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshEstimateRequest'
      responses:
        '200':
          description: Оценка бюджета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEstimate'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /solver/tasks:
    get:
      tags:
      - Compute
      summary: Журнал задач расчёта
      operationId: listSolverTasks
      parameters:
      - name: structure_id
        in: query
        description: Фильтр по экземпляру структуры.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/StatusQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница задач расчёта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverTaskList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /solver/tasks/{task_id}:
    get:
      tags:
      - Compute
      summary: Задача расчёта с журналом сходимости
      operationId: getSolverTask
      parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: Задача расчёта и отчёт о сходимости.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverTask'
        '404':
          $ref: '#/components/responses/NotFound'
  /solver/tasks/{task_id}/cancel:
    post:
      tags:
      - Compute
      summary: Отменить задачу расчёта
      description: Освобождает VRAM и удаляет промежуточные данные, если запрошено.
      operationId: cancelSolverTask
      parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCancelRequest'
      responses:
        '202':
          description: Отмена принята.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /solver/tasks/{task_id}/fields/{quantity}:
    get:
      tags:
      - Compute
      summary: Карта поля задачи
      description: |
        Метаданные карты и (для небольших сеток) значения. Большие карты
        запрашиваются постранично через `/fields/{quantity}/pages`.
      operationId: getTaskFieldMap
      parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      - name: quantity
        in: path
        required: true
        description: Физическая величина поля.
        schema:
          $ref: '#/components/schemas/FieldQuantity'
      responses:
        '200':
          description: Карта поля.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldMap'
        '404':
          $ref: '#/components/responses/NotFound'
  /solver/tasks/{task_id}/fields/{quantity}/pages:
    get:
      tags:
      - Compute
      summary: Страница значений большой карты
      operationId: getTaskFieldMapPage
      parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      - name: quantity
        in: path
        required: true
        description: Физическая величина поля.
        schema:
          $ref: '#/components/schemas/FieldQuantity'
      - name: offset
        in: query
        description: Начальный индекс значений.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: count
        in: query
        description: Размер страницы значений.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 65536
      responses:
        '200':
          description: Страница значений с указателем следующей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldMapPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /solver/tasks/{task_id}/fields/interpolate:
    post:
      tags:
      - Compute
      summary: Интерполяция поля в точке
      description: |
        Значение поля в произвольной точке (FR-GUI-05) — для отображения значения
        под курсором на 3D-виде.
      operationId: interpolateFieldValue
      parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldInterpolationQuery'
      responses:
        '200':
          description: Интерполированное значение и признак попадания в область.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldInterpolationResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /solver/characteristic-sets/{set_id}:
    get:
      tags:
      - Compute
      summary: Сохранённый набор кривых
      description: Набор кривых по характеристике для перерисовки графиков GUI.
      operationId: getCharacteristicSet
      parameters:
      - name: set_id
        in: path
        required: true
        description: Идентификатор набора кривых.
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Набор кривых.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacteristicSet'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalog/device-families:
    get:
      tags:
      - Catalog
      summary: Справочник семейств приборов
      description: |
        Десять семейств с основным методом расчёта и целевым форматом экспорта
        (FR-EXP-01). Используется GUI для заполнения списка структур.
      operationId: listDeviceFamilies
      security: []
      responses:
        '200':
          description: Семейства приборов.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceFamilyLabel'
  /catalog/geometry-fields:
    get:
      tags:
      - Catalog
      summary: Поля геометрии семейства с диапазонами для GUI
      description: |
        Возвращает определения полей EAV и допустимые диапазоны
        (`GeometryRange`), по которым GUI перенастраивает QDoubleSpinBox.
      operationId: listGeometryFields
      parameters:
      - $ref: '#/components/parameters/DeviceFamilyQuery'
      responses:
        '200':
          description: Поля геометрии и их диапазоны.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeometryFieldDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
  /catalog/geometry-ranges:
    get:
      tags:
      - Catalog
      summary: Диапазоны значений полей геометрии
      description: |
        Границы, значение по умолчанию и единицы для контроля ввода. Значения
        согласованы с инвариантами семейств (FR-CORE-01).
      operationId: listGeometryRanges
      parameters:
      - $ref: '#/components/parameters/DeviceFamilyQuery'
      responses:
        '200':
          description: Диапазоны значений.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeometryRange'
  /catalog/materials:
    get:
      tags:
      - Catalog
      summary: Справочник материалов слоёв
      operationId: listMaterials
      security: []
      responses:
        '200':
          description: Материалы (канал, оксид, барьер, подложка, электроды).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
  /catalog/capabilities:
    get:
      tags:
      - Catalog
      summary: Возможности семейства
      description: |
        Набор поддерживаемых методов, форматов экспорта и EDA-симуляторов.
        Определяет, какие кнопки GUI активны для выбранной структуры.
      operationId: getDeviceCapabilities
      parameters:
      - name: device_family
        in: query
        required: true
        description: Семейство прибора.
        schema:
          $ref: '#/components/schemas/DeviceFamily'
      responses:
        '200':
          description: Возможности семейства.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCapabilities'
        '400':
          $ref: '#/components/responses/BadRequest'
  /profiles:
    get:
      tags:
      - Devices
      summary: Профили конфигурации семейств
      operationId: listProfiles
      parameters:
      - $ref: '#/components/parameters/DeviceFamilyQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница профилей.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/{profile_id}:
    get:
      tags:
      - Devices
      summary: Профиль по идентификатору
      operationId: getProfile
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: Профиль семейства.
          headers:
            ETag:
              description: Версия ресурса для оптимистичной блокировки (`If-Match`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/NotFound'
  /structures:
    get:
      tags:
      - Devices
      summary: Список структур
      description: |
        Краткие записи без геометрии и CAD-данных; полный набор параметров —
        через `/structures/{structure_id}` или `/structures/{structure_id}/export`.
      operationId: listStructures
      parameters:
      - $ref: '#/components/parameters/DeviceFamilyQuery'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Страница структур.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStructureList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Devices
      summary: Создать структуру
      description: |
        Параметрическая геометрия без STL. Проверяются обязательные поля семейства
        и инварианты (например, `fin_pitch_nm ≥ fin_width_nm`).
      operationId: createStructure
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStructureCreate'
      responses:
        '201':
          description: Структура создана.
          headers:
            Location:
              description: Канонический URL созданного ресурса.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStructure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /structures/{structure_id}:
    get:
      tags:
      - Devices
      summary: Структура с полным набором параметров
      operationId: getStructure
      parameters:
      - $ref: '#/components/parameters/StructureIdPath'
      responses:
        '200':
          description: Структура с физическими параметрами и геометрией.
          headers:
            ETag:
              description: Версия ресурса для оптимистичной блокировки (`If-Match`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStructure'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Devices
      summary: Частично обновить структуру
      description: |
        Требует `If-Match` с текущим `ETag`; изменение `device_id` запрещено —
        для другой геометрии создаётся новая структура.
      operationId: updateStructure
      parameters:
      - $ref: '#/components/parameters/StructureIdPath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStructureUpdate'
      responses:
        '200':
          description: Обновлённая структура.
          headers:
            ETag:
              description: Версия ресурса для оптимистичной блокировки (`If-Match`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStructure'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Devices
      summary: Удалить структуру
      operationId: deleteStructure
      parameters:
      - $ref: '#/components/parameters/StructureIdPath'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Структура удалена.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /structures/validate:
    post:
      tags:
      - Devices
      summary: Проверка структуры без сохранения
      description: |
        Валидирует параметры и геометрию перед созданием: обязательные поля
        семейства, диапазоны `geometry_ranges`, инварианты и расчётные
        возможности. Возвращает ошибки по полям, а не задачу.
      operationId: validateStructure
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStructureCreate'
      responses:
        '200':
          description: Результат проверки с токенами ошибок и предупреждениями.
          headers:
            X-Request-Id:
              description: Идентификатор запроса для трассировки (NFR-REL-02).
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /structures/import-cad:
    post:
      tags:
      - Devices
      summary: Импорт CAD-геометрии (STL)
      description: |
        Принимает STL (binary/ASCII) и метаданные. Сервер проверяет
        треугольники, единицы и ненулевой размер по всем осям (FR-IMP-02);
        при `await_mesh=true` синхронно строит предварительную сетку.
      operationId: importCadStructure
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/CadImportRequest'
              - type: object
                required:
                - file
                properties:
                  file:
                    type: string
                    format: binary
                    description: Бинарный или текстовый STL-файл структуры.
      responses:
        '201':
          description: Структура создана из CAD-геометрии.
          headers:
            Location:
              description: Канонический URL созданного ресурса.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStructure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          description: Неподдерживаемый тип файла.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /structures/{structure_id}/cad:
    get:
      tags:
      - Devices
      summary: Метаданные CAD-геометрии
      operationId: getStructureCadGeometry
      parameters:
      - $ref: '#/components/parameters/StructureIdPath'
      responses:
        '200':
          description: Метаданные STL (число треугольников, габариты, единицы).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StlGeometry'
        '404':
          $ref: '#/components/responses/NotFound'
  /structures/{structure_id}/export:
    get:
      tags:
      - Devices
      summary: Экспорт полного набора параметров
      description: |
        JSON-отчёт со структурой, профилем, настройками решателя и ссылками на
        последние расчёты (FR-IMP-03). Используется при переносе структуры.
      operationId: exportStructureParameters
      parameters:
      - $ref: '#/components/parameters/StructureIdPath'
      responses:
        '200':
          description: Полный набор параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterSetExport'
        '404':
          $ref: '#/components/responses/NotFound'
  /measurements/import:
    post:
      tags:
      - Extraction
      summary: Импорт измерений из CSV (FR-IMP-01)
      description: |
        Принимает CSV/лог с измерениями. Сервер определяет размерности по
        заголовкам, раскладывает данные на свипы и проверяет число точек; ошибки
        разбора возвращаются как `INVALID_MEASUREMENT_COLUMNS` или
        `EMPTY_MEASUREMENT`.
      operationId: importMeasurements
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/MeasurementImportRequest'
              - type: object
                required:
                - file
                properties:
                  file:
                    type: string
                    format: binary
                    description: CSV-файл или текстовый лог измерений.
      responses:
        '201':
          description: Набор измерений создан.
          headers:
            Location:
              description: Канонический URL созданного ресурса.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSet'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /measurements:
    get:
      tags:
      - Extraction
      summary: Список наборов измерений
      operationId: listMeasurementSets
      parameters:
      - name: structure_id
        in: query
        description: Фильтр по экземпляру структуры.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: source
        in: query
        description: Фильтр по источнику данных.
        required: false
        schema:
          $ref: '#/components/schemas/MeasurementSource'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница наборов измерений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /measurements/{set_id}:
    get:
      tags:
      - Extraction
      summary: Набор измерений
      operationId: getMeasurementSet
      parameters:
      - $ref: '#/components/parameters/MeasurementSetIdPath'
      responses:
        '200':
          description: Набор измерений с описанием свипов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSet'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Extraction
      summary: Удалить набор измерений
      operationId: deleteMeasurementSet
      parameters:
      - $ref: '#/components/parameters/MeasurementSetIdPath'
      responses:
        '204':
          description: Набор удалён.
        '404':
          $ref: '#/components/responses/NotFound'
  /measurements/{set_id}/points:
    get:
      tags:
      - Extraction
      summary: Точки измерений (постранично)
      description: Точки отдаются страницами, чтобы GUI не загружал весь свип.
      operationId: listMeasurementPoints
      parameters:
      - $ref: '#/components/parameters/MeasurementSetIdPath'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница точек.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementPointsPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /extraction/sessions:
    get:
      tags:
      - Extraction
      summary: Сессии экстракции
      operationId: listExtractionSessions
      parameters:
      - name: structure_id
        in: query
        description: Фильтр по структуре.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/StatusQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница сессий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Extraction
      summary: Запустить многопараметрический фиттинг (FR-EXT-02)
      description: |
        Стартовые приближения по максимальной крутизне рассчитываются сервером
        (FR-EXT-01), затем выполняется фиттинг по группе структур. Ответ `201`
        содержит `session_id`, `job_id` и стартовые VTH0/U0; прогресс — через
        SSE и `/extraction/sessions/{session_id}/progress`.
      operationId: createExtractionSession
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionSessionCreate'
      responses:
        '201':
          description: Сессия создана и поставлена в очередь.
          headers:
            Location:
              description: Канонический URL созданного ресурса.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionSessionAccepted'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /extraction/sessions/{session_id}:
    get:
      tags:
      - Extraction
      summary: Сессия экстракции с результатами
      operationId: getExtractionSession
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Сессия, извлечённые параметры и отчёт по шагам BSIM4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionSession'
        '404':
          $ref: '#/components/responses/NotFound'
  /extraction/sessions/{session_id}/progress:
    get:
      tags:
      - Extraction
      summary: Снимок прогресса фиттинга
      description: Итерации, невязка и текущие параметры для графика сходимости.
      operationId: getExtractionProgress
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Снимок хода фиттинга.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionProgress'
        '404':
          $ref: '#/components/responses/NotFound'
  /extraction/curve-metrics:
    post:
      tags:
      - Extraction
      summary: Расчёт curve metrics по набору измерений
      description: |
        Метрики непосредственно по измеренной кривой (без компактной модели) —
        основной результат для TFET/HEMT и устройств памяти.
      operationId: computeCurveMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - measurement_set_id
              properties:
                measurement_set_id:
                  type: integer
                  format: int64
                structure_id:
                  type: integer
                  format: int64
                spec_ids:
                  type: array
                  description: Характеристики, по которым считаются метрики.
                  items:
                    type: string
      responses:
        '200':
          description: Значения метрик с ограничениями применимости.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurveMetricsResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /extraction/metrics:
    get:
      tags:
      - Extraction
      summary: Справочник метрик
      description: Определения метрик, единицы и условия применимости.
      operationId: listMetricDefinitions
      security: []
      responses:
        '200':
          description: Определения метрик.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricDefinition'
  /extraction/spice-models:
    get:
      tags:
      - Extraction
      summary: SPICE-карты и результаты экстракции
      operationId: listSpiceModels
      parameters:
      - name: structure_id
        in: query
        description: Фильтр по структуре.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница SPICE-карт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpiceModelList'
  /extraction/spice-models/{model_id}:
    get:
      tags:
      - Extraction
      summary: SPICE-карта по идентификатору
      operationId: getSpiceModel
      parameters:
      - $ref: '#/components/parameters/SpiceModelIdPath'
      responses:
        '200':
          description: SPICE-карта с метаданными и текстом модели.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpiceModel'
        '404':
          $ref: '#/components/responses/NotFound'
  /extraction/spice-models/export:
    post:
      tags:
      - Extraction
      summary: Дифференцированный экспорт модели (FR-EXP-01)
      description: |
        Для `planar_mosfet` возвращается полная карта BSIM4; для остальных
        семейств — JSON с curve metrics и явным `NOT_SUPPORTED` для BSIM4.
      operationId: exportSpiceModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpiceExportRequest'
      responses:
        '200':
          description: Выгруженная модель или JSON с метриками.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpiceExportResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /reports/analysis:
    post:
      tags:
      - Reports
      summary: Отчёт анализа экстракции
      description: |
        JSON-отчёт с параметрами, метриками и ссылками на источники данных.
      operationId: createAnalysisReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - structure_id
              properties:
                structure_id:
                  type: integer
                  format: int64
                session_id:
                  type: integer
                  format: int64
                include_curve_metrics:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Отчёт создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisReport'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /integrations/eda:
    get:
      tags:
      - Integrations
      summary: Настройки подключения к EDA-симуляторам
      description: |
        Пути к ngspice, Micro-Cap CLI, OpenVAF и признак доступности Tanner
        T-Spice (NFR-COM-01). Секреты не возвращаются.
      operationId: listEdaIntegrations
      responses:
        '200':
          description: Список настроек по симуляторам.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EdaIntegration'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /integrations/eda/{simulator}:
    put:
      tags:
      - Integrations
      summary: Обновить настройки симулятора
      description: |
        Меняет путь к исполняемому файлу и параметры запуска. Доступно роли
        `admin`; после сохранения выполняется проверка запуска.
      operationId: updateEdaIntegration
      parameters:
      - name: simulator
        in: path
        required: true
        description: Целевой симулятор.
        schema:
          $ref: '#/components/schemas/EdaSimulator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - executable_path
              properties:
                executable_path:
                  type: string
                  maxLength: 512
                timeout_s:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  default: 300
      responses:
        '200':
          description: Сохранённые настройки и результат проверки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdaIntegration'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Integrations
      summary: Сбросить настройки симулятора
      description: Возвращает пустой путь; операции с симулятором становятся недоступны.
      operationId: resetEdaIntegration
      parameters:
      - name: simulator
        in: path
        required: true
        description: Целевой симулятор.
        schema:
          $ref: '#/components/schemas/EdaSimulator'
      responses:
        '204':
          description: Настройки сброшены.
        '403':
          $ref: '#/components/responses/Forbidden'
  /integrations/eda/{simulator}/check:
    post:
      tags:
      - Integrations
      summary: Проверить доступность симулятора
      description: |
        Запускает симулятор с тестовой командой и сообщает версию или причину
        недоступности (`EDA_TOOL_UNAVAILABLE`).
      operationId: checkEdaIntegration
      parameters:
      - name: simulator
        in: path
        required: true
        description: Целевой симулятор.
        schema:
          $ref: '#/components/schemas/EdaSimulator'
      responses:
        '200':
          description: Результат проверки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdaIntegration'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /reports:
    get:
      tags:
      - Reports
      summary: Список отчётов
      operationId: listReports
      parameters:
      - name: structure_id
        in: query
        description: Фильтр по структуре.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/StatusQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница отчётов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Reports
      summary: Сгенерировать LaTeX-отчёт
      description: |
        Собирает финальные таблицы параметров, графики наложения кривых и журнал
        верификации; компиляция PDF выполняется асинхронно (юнит `report`).
      operationId: createReport
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: Задача генерации отчёта принята.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /reports/{report_id}:
    get:
      tags:
      - Reports
      summary: Отчёт с LaTeX-исходником
      operationId: getReport
      parameters:
      - $ref: '#/components/parameters/ReportIdPath'
      responses:
        '200':
          description: Метаданные отчёта и исходник LaTeX.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{report_id}/download:
    get:
      tags:
      - Reports
      summary: Скачать PDF отчёта
      operationId: downloadReport
      parameters:
      - $ref: '#/components/parameters/ReportIdPath'
      responses:
        '200':
          description: Скомпилированный PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /health:
    get:
      tags:
      - System
      summary: Состояние сервиса и его зависимостей
      description: |
        Возвращает агрегированный статус БД, хранилища, CUDA, EDA-инструментов и
        LaTeX. Используется Jenkins-доставкой и GUI для индикатора доступности.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Сервис отвечает, статус каждой зависимости в `checks`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /version:
    get:
      tags:
      - System
      summary: Версия контракта API
      operationId: getApiVersion
      security: []
      responses:
        '200':
          description: Версия API и хеш контракта для проверки совместимости GUI.
          content:
            application/json:
              schema:
                type: object
                required:
                - api_version
                - contract_version
                properties:
                  api_version:
                    type: string
                    examples:
                    - v1
                  contract_version:
                    type: string
                    examples:
                    - 1.0.0
                  git_commit:
                    type: string
  /jobs:
    get:
      tags:
      - System
      summary: Журнал фоновых задач
      description: |
        Задачи расчёта, экстракции, верификации и обучения. Терминальные задачи
        хранятся NFR-REL-05 и доступны для повторного просмотра результата.
      operationId: listJobs
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/SinceStream'
      - name: kind
        in: query
        description: Фильтр по типу операции.
        schema:
          $ref: '#/components/schemas/JobKind'
      - name: status
        in: query
        description: Фильтр по состоянию задачи.
        schema:
          $ref: '#/components/schemas/JobStatus'
      responses:
        '200':
          description: Страница журнала задач.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/{job_id}:
    get:
      tags:
      - System
      summary: Состояние задачи
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobIdPath'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Задача с текущим прогрессом и ссылками на результаты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - System
      summary: Отменить задачу
      description: |
        Публикует `cancel_requested`; задача переходит в `cancelled`, если
        решатель ещё не завершил текущий этап.
      operationId: cancelJob
      parameters:
      - $ref: '#/components/parameters/JobIdPath'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '202':
          description: Запрос на отмену принят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{job_id}/events:
    get:
      tags:
      - System
      summary: Поток прогресса задачи (SSE)
      description: |
        `text/event-stream` с событием `progress` на каждый этап и событием
        `done` в терминальном состоянии. Соединение закрывается сервером после
        `done`; клиент может переподключиться с `Last-Event-ID`.
      operationId: streamJobEvents
      parameters:
      - $ref: '#/components/parameters/JobIdPath'
      - name: Last-Event-ID
        in: header
        description: Идентификатор последнего полученного события (переподключение).
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Поток событий задачи.
          headers:
            X-Request-Id:
              description: Идентификатор запроса для трассировки (NFR-REL-02).
              schema:
                type: string
                format: uuid
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/JobEvent'
        '404':
          $ref: '#/components/responses/NotFound'
  /telemetry/gpu:
    get:
      tags:
      - Telemetry
      summary: Снимок телеметрии GPU
      description: |
        Загрузка, VRAM, температура и питание хоста через nvidia-smi или PyTorch.
        Если данных нет, `source=unavailable` (не ошибка).
      operationId: getGpuTelemetry
      responses:
        '200':
          description: Снимок телеметрии GPU.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /telemetry/node:
    get:
      tags:
      - Telemetry
      summary: Снимок телеметрии узла
      description: CPU, память и диск расчётной станции.
      operationId: getNodeTelemetry
      responses:
        '200':
          description: Снимок телеметрии узла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTelemetry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /telemetry/stream:
    get:
      tags:
      - Telemetry
      summary: Поток телеметрии (SSE)
      description: |
        Кадры телеметрии с монотонным `sequence`; используется панелью
        мониторинга GUI.
      operationId: streamTelemetry
      parameters:
      - $ref: '#/components/parameters/SinceStream'
      responses:
        '200':
          description: Поток кадров телеметрии.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TelemetryStreamFrame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/runs:
    get:
      tags:
      - Verification
      summary: Прогоны верификации
      operationId: listVerificationRuns
      parameters:
      - name: structure_id
        in: query
        description: Фильтр по структуре.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: mode
        in: query
        description: Фильтр по режиму верификации.
        required: false
        schema:
          $ref: '#/components/schemas/VerificationMode'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница прогонов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Verification
      summary: Запустить верификацию в EDA (FR-EXT-06)
      description: |
        Сквозной прогон карты в ngspice/Micro-Cap с обвязкой. Финальные параметры
        экстракции принимаются только по результату этого прогона.
      operationId: createVerificationRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRunRequest'
      responses:
        '202':
          description: Прогон поставлен в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationAccepted'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /verification/runs/{run_id}:
    get:
      tags:
      - Verification
      summary: Прогон верификации с результатом
      operationId: getVerificationRun
      parameters:
      - $ref: '#/components/parameters/VerificationRunIdPath'
      responses:
        '200':
          description: Прогон, наложенные кривые и итоговый вердикт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /verification/verilog-a/compile:
    post:
      tags:
      - Verification
      summary: Компиляция Verilog-A через OpenVAF
      description: |
        Компилирует Verilog-A модуль в OSDI (FR-EXT-05). Источник передаётся
        текстом либо ссылкой на существующую карту.
      operationId: compileVerilogA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerilogACompileRequest'
      responses:
        '200':
          description: Результат компиляции (диагностика, путь к OSDI).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerilogACompileResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /verification/loopback:
    post:
      tags:
      - Verification
      summary: Loopback-самотестирование (FR-EXT-07)
      description: |
        Эталонная карта → генерация ВАХ → внутренняя экстракция → сравнение с
        эталонными параметрами в пределах допуска.
      operationId: runLoopbackVerification
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoopbackRequest'
      responses:
        '202':
          description: Прогон принят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopbackResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /verification/hysteresis:
    post:
      tags:
      - Verification
      summary: Валидация гистерезиса мемристора (FR-EXT-05)
      description: |
        Проверяет форму петли: вырождение в прямую линию отбраковывается,
        площадь петли должна превышать порог.
      operationId: validateMemoryHysteresis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRunRequest'
      responses:
        '200':
          description: Результат проверки петли.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HysteresisValidation'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    SurrogateFamily:
      type: string
      description: |
        Назначение суррогата. `unet_*` — регулярная сетка (A-7), `gnn_*` — граф
        на тетраэдральном меше / CAD-геометрии (A-8).
      enum:
      - unet_poisson
      - unet_az
      - unet_carriers
      - gnn_field
      - gnn_iv
    SurrogateTopology:
      type: string
      enum:
      - U-Net
      - GCN
      - GraphSAGE
      - GAT
    TrainingDataset:
      type: object
      description: |
        Источник обучающих данных. Обучение только на данных проверенного
        решателя (NFR-REL-04); `synthetic` допустим лишь для предразогрева.
      required:
      - split
      - source
      properties:
        split:
          type: string
          enum:
          - train
          - val
          - test
        source:
          type: string
          enum:
          - fem_reference
          - measurement
          - synthetic
          - ngspice_reference
        count:
          type: integer
          minimum: 0
    DeviceFamily:
      type: string
      description: Семейство полупроводникового прибора (device_labels, 10 записей).
      enum:
      - planar_mosfet
      - fd_soi
      - finfet
      - gaa_nanosheet
      - gaa_nanowire
      - tfet
      - hemt
      - memristor
      - memtransistor
      - cad_custom
    SurrogateModel:
      type: object
      description: Запись реестра обученных моделей (таблица `surrogate_models`).
      required:
      - surrogate_id
      - family
      - topology
      - checkpoint_path
      properties:
        surrogate_id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        family:
          $ref: '#/components/schemas/SurrogateFamily'
        topology:
          $ref: '#/components/schemas/SurrogateTopology'
        device_families:
          type: array
          description: Семейства приборов, на которых обучена модель.
          items:
            $ref: '#/components/schemas/DeviceFamily'
        in_channels:
          type: integer
          minimum: 1
        out_channels:
          type: integer
          minimum: 1
        grid_size:
          type: integer
          description: |
            Сторона регулярной сетки для U-Net. Для GNN не задаётся (0) —
            размер входа определяется мешем.
          minimum: 0
        checkpoint_path:
          type: string
        onnx_path:
          type: string
        onnx_opset:
          type: integer
          description: Версия opset экспорта (A-8 — opset 17).
        train_loss:
          type: number
          format: double
        val_rmse_rel:
          type: number
          format: double
          description: Относительная RMSE на валидационном сплите физического решателя.
        physical_residual:
          type: number
          format: double
          description: |
            Невязка уравнения Пуассона на предсказанном поле — главная метрика
            физической корректности суррогата.
        c2_continuity_ok:
          type: boolean
          description: |
            Гейт NFR-REL-02: вторая производная вдоль ВАХ/ВФХ непрерывна на
            диапазоне −5…+5 В.
        monotonic_iv_ok:
          type: boolean
          description: Гейт монотонности тока по напряжению затвора.
        iterations_saved_percent:
          type: number
          format: float
          description: |
            Сокращение итераций основного решателя при warm start, %.
            Требование NFR-PERF-03 — не менее 30 %.
        status:
          type: string
          enum:
          - draft
          - validating
          - active
          - archived
          - failed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PageMeta:
      type: object
      description: Метаданные страницы (курсорная и offset-пагинация поддерживаются одновременно).
      required:
      - page
      - page_size
      - total_items
      properties:
        page:
          type: integer
          minimum: 0
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        sort:
          type: string
          description: Применённая сортировка (с префиксом «-» для убывания).
        next_cursor:
          type:
          - string
          - 'null'
          description: Курсор следующей страницы (для больших перечислений).
    SurrogateModelList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/SurrogateModel'
    SurrogateModelCreate:
      type: object
      required:
      - name
      - family
      - topology
      properties:
        name:
          type: string
          maxLength: 120
        family:
          $ref: '#/components/schemas/SurrogateFamily'
        topology:
          $ref: '#/components/schemas/SurrogateTopology'
        device_families:
          type: array
          items:
            $ref: '#/components/schemas/DeviceFamily'
        in_channels:
          type: integer
          minimum: 1
          default: 4
        out_channels:
          type: integer
          minimum: 1
          default: 2
        grid_size:
          type: integer
          minimum: 0
          default: 32
        description:
          type: string
    ValidationSplit:
      type: object
      description: Разбиение выборки; MSE всегда считается на `val` (NFR-REL-04).
      properties:
        train_points:
          type: integer
        validation_points:
          type: integer
        test_points:
          type: integer
        seed:
          type: integer
    TrainingRequest:
      type: object
      description: |
        Запуск обучения (A-7/A-8). Данные берутся из `training_samples`,
        накопленных эталонными прогонами FEM.
      required:
      - surrogate_id
      properties:
        surrogate_id:
          type: integer
          format: int64
        samples:
          type: integer
          minimum: 1
          default: 1000
        datasets:
          type: array
          description: Состав обучающей выборки (по умолчанию — все проверенные FEM-прогоны).
          items:
            $ref: '#/components/schemas/TrainingDataset'
        epochs:
          type: integer
          minimum: 1
          default: 50
        batch_size:
          type: integer
          minimum: 1
          default: 8
        learning_rate:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 0.0005
        seed:
          type: integer
          default: 42
        device:
          type: string
          enum:
          - cuda
          - cpu
          default: cuda
        amp_enabled:
          type: boolean
          description: Mixed precision (AMP/TF32) при обучении; инференс всегда FP64-совместим.
          default: true
        loss_weights:
          type: object
          description: |
            Веса композитной физически-информированной функции потерь
            αL_data + βL_Poisson + γL_continuity + δL_BC + ζL_charge.
          properties:
            data:
              type: number
              format: double
              default: 1
            poisson:
              type: number
              format: double
              default: 0.1
            continuity:
              type: number
              format: double
              default: 0.1
            boundary:
              type: number
              format: double
              default: 0.1
            charge:
              type: number
              format: double
              default: 0.05
        validation_split:
          $ref: '#/components/schemas/ValidationSplit'
        active_learning:
          type: boolean
          description: Online fine-tune по порогу неуверенности (ФТ.5.4).
          default: false
    JobStatus:
      type: string
      description: |
        Состояние фоновой задачи. Терминальные состояния: `ok`, `failed`,
        `cancelled`. `queued` → `running` → терминальное.
      enum:
      - queued
      - running
      - ok
      - failed
      - cancelled
    JobStage:
      type: string
      description: Этап задачи, отображаемый в прогресс-баре GUI.
      enum:
      - queue
      - mesh_generation
      - assemble
      - solve
      - postprocess
      - warm_start
      - fitting
      - spice_steps
      - compile_verilog_a
      - netlist_synthesis
      - eda_simulation
      - loopback_compare
      - latex_render
      - pdf_compile
      - training_epoch
      - onnx_export
    TrainingRun:
      type: object
      description: Запись журнала обучения (таблица `training_runs`).
      required:
      - training_id
      - surrogate_id
      - status
      properties:
        training_id:
          type: integer
          format: int64
        surrogate_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        stage:
          $ref: '#/components/schemas/JobStage'
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
        samples:
          type: integer
        epochs:
          type: integer
        batch_size:
          type: integer
        seed:
          type: integer
        device:
          type: string
        amp_enabled:
          type: boolean
        loss_data:
          type: number
          format: double
        loss_poisson:
          type: number
          format: double
        loss_continuity:
          type: number
          format: double
        val_rmse_rel:
          type: number
          format: double
          description: Метрика на отложенной выборке от физического решателя.
        physical_residual:
          type: number
          format: double
        duration_s:
          type: number
          format: double
        loss_history:
          type: array
          description: История лосса по эпохам (для графика в GUI).
          items:
            type: number
            format: double
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    TrainingRunList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/TrainingRun'
    TrainingAccepted:
      type: object
      required:
      - training_id
      - job_id
      - status
      properties:
        training_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        events_url:
          type: string
    OperatingPoint:
      type: object
      description: Рабочая точка для расчёта. Мощность тепловыделения P = Vds · Id (FR-CORE-02).
      required:
      - drain_voltage
      - drain_current
      properties:
        gate_voltage:
          type: number
          format: double
          description: Напряжение затвора, В.
          examples:
          - 0.8
        drain_voltage:
          type: number
          format: double
          description: Напряжение сток–исток, В.
          examples:
          - 0.8
        drain_current:
          type: number
          format: double
          description: Ток стока для расчёта тепловыделения и индукции (FR-CORE-04), А.
          examples:
          - 0.0001
        body_voltage:
          type: number
          format: double
          description: Напряжение подложки/back-gate, В.
        ambient_temperature_k:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 300
          description: Температура окружения (границы Дирихле тепловой задачи), К.
        thermal_conductivity_w_mk:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 130
          description: Коэффициент теплопроводности материала, Вт/(м·К).
        substrate_thickness_um:
          type: number
          format: double
          exclusiveMinimum: 0
          default: 0.5
          description: Толщина подложки расчётной области, мкм.
    MeshQuality:
      type: string
      description: |
        Пресет качества расчётной сетки. `custom` требует явных размеров в
        `grid_shape` (FR-CORE-01).
      enum:
      - rough
      - optimal
      - precise
      - custom
    MeshRequest:
      type: object
      description: Настройка расчётной сетки (FR-CORE-01).
      properties:
        quality:
          $ref: '#/components/schemas/MeshQuality'
          default: optimal
        grid_shape:
          type: array
          description: Явные размеры сетки (обязательны для quality=custom), 4…MAX_MESH_NODES на ось.
          minItems: 3
          maxItems: 3
          items:
            type: integer
            minimum: 4
            maximum: 256
        refinement_points:
          type: array
          description: Точки локального сгущения (канал, затвор, границы слоёв), нормированные 0…1.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
              format: double
              minimum: 0
              maximum: 1
        substrate_thickness_um:
          type: number
          format: double
          exclusiveMinimum: 0
    InferenceRequest:
      type: object
      description: |
        Пробный инференс суррогата без записи в задачу — для оценки warm start
        и сравнения с прямым FEM.
      required:
      - structure_id
      - operating_point
      properties:
        structure_id:
          type: integer
          format: int64
        surrogate_id:
          type: integer
          format: int64
          description: По умолчанию выбирается активная модель семейства.
        operating_point:
          $ref: '#/components/schemas/OperatingPoint'
        mesh:
          $ref: '#/components/schemas/MeshRequest'
        compare_with_fem:
          type: boolean
          default: false
          description: Выполнить прямой FEM и вернуть невязку тёплого старта.
    ComputeBackend:
      type: string
      description: |
        Вычислительный бэкенд. Порядок предпочтения: `cuda_fp64` → `cpu_scipy`;
        `rust_native` — нативное ядро (PyO3 + ONNX Runtime) для warm start,
        `cpu_torch` — резервный torch-путь quantum-Poisson.
      enum:
      - cuda_fp64
      - cpu_scipy
      - cpu_torch
      - rust_native
    FieldQuantity:
      type: string
      description: |
        Физическая величина поля. `T` — температура (FR-CORE-02),
        `V` — потенциал, `|E|` — модуль напряжённости (FR-CORE-03),
        `Az` — векторный потенциал, `B` — магнитная индукция (FR-CORE-04),
        `n`/`p` — концентрации носителей (quantum-Poisson).
      enum:
      - T
      - V
      - E
      - Az
      - B
      - n
      - p
      - dT
    AxisArray:
      type: object
      description: |
        Одна ось сетки (равномерная или адаптивно сгущённая). Порядок элементов
        соответствует порядку элементов `FieldMapData.values`.
      required:
      - name
      - values
      - unit
      properties:
        name:
          type: string
          enum:
          - x
          - y
          - z
          - time
          - frequency
        values:
          type: array
          description: Координаты узлов по возрастанию.
          minItems: 2
          items:
            type: number
            format: double
        unit:
          type: string
          examples:
          - m
    FieldMapData:
      type: object
      description: |
        Карта поля. Для сеток свыше порога `inline_max_bytes` значения отдаются
        постранично (`values` отсутствует, `pages` задаёт разбиение).
      required:
      - quantity
      properties:
        quantity:
          $ref: '#/components/schemas/FieldQuantity'
        unit:
          type: string
        axes:
          type: array
          description: Оси сетки в порядке индексации.
          items:
            $ref: '#/components/schemas/AxisArray'
        shape:
          type: array
          description: Размерность массива по осям.
          items:
            type: integer
        values:
          type: array
          description: |
            Плоский массив значений в порядке C (последняя ось меняется быстрее).
            Тип — `number` (double) или `null` для неактивных узлов вне области.
          items:
            type:
            - number
            - 'null'
            format: double
        dtype:
          type: string
          enum:
          - float64
          - float32
          default: float64
        encoding:
          type: string
          description: Кодирование значений.
          enum:
          - json
          - base64_float64
          - npz
          default: json
        base64_values:
          type: string
          description: Base64 от array(float64)/array(float32) little-endian (при encoding!=json).
        texture_size:
          type: array
          description: Рекомендуемый размер текстуры для 3D-сцены (лофтинг по трём осям).
          items:
            type: integer
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        mean:
          type: number
          format: double
        checksum:
          type: string
          description: SHA-256 массива значений (кэширование в GUI).
    FieldMap:
      type: object
      description: Метаданные карты поля + (опционально) данные.
      required:
      - task_id
      - quantity
      - shape
      properties:
        task_id:
          type: integer
          format: int64
        field_data_id:
          type: integer
          format: int64
        quantity:
          $ref: '#/components/schemas/FieldQuantity'
        value_name:
          type: string
          examples:
          - T
        value_unit:
          type: string
          examples:
          - K
        description:
          type: string
        shape:
          type: array
          items:
            type: integer
        axes_meta:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              unit:
                type: string
              min:
                type: number
                format: double
              max:
                type: number
                format: double
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        checksum:
          type: string
        data_url:
          type: string
          examples:
          - /api/v1/solver/tasks/512/fields/T?page=0
        data:
          $ref: '#/components/schemas/FieldMapData'
    WarmStartReport:
      type: object
      description: Отчёт о применении суррогата и последующей точной доводке.
      required:
      - applied
      - fallback_to_fem
      properties:
        applied:
          type: boolean
        surrogate_model_id:
          type: integer
          format: int64
        topology:
          type: string
          enum:
          - U-Net
          - GCN
          - GraphSAGE
          - GAT
        uncertainty:
          type: number
          format: float
          description: Оценка неуверенности модели (0…1).
        warm_start_residual:
          type: number
          format: double
          description: Начальная невязка после инференса.
        iterations_with_warm_start:
          type: integer
        iterations_baseline:
          type: integer
        iterations_saved_percent:
          type: number
          format: float
          description: Сокращение числа итераций, %. Требование NFR-PERF-03 — не менее 30 %.
        fallback_to_fem:
          type: boolean
          description: true — суррогат отклонён (физическая невязка/гейты), выполнен прямой FEM.
        fallback_reason:
          type: string
          enum:
          - uncertainty
          - residual_gate
          - monotonicity_gate
          - c2_continuity_gate
          - onnx_error
          - disabled
    FemComparison:
      type: object
      description: Сравнение warm start с точным FEM (обоснование ускорения, NFR-PERF-03).
      properties:
        warm_start_residual:
          type: number
          format: double
        fem_residual:
          type: number
          format: double
        max_abs_difference:
          type: number
          format: double
        iterations_with_warm_start:
          type: integer
        iterations_baseline:
          type: integer
        iterations_saved_percent:
          type: number
          format: float
        passed:
          type: boolean
    InferenceResult:
      type: object
      required:
      - surrogate_id
      - applied
      properties:
        surrogate_id:
          type: integer
          format: int64
        applied:
          type: boolean
        backend_used:
          $ref: '#/components/schemas/ComputeBackend'
        inference_ms:
          type: number
          format: double
        field_maps:
          type: array
          items:
            $ref: '#/components/schemas/FieldMap'
        warm_start:
          $ref: '#/components/schemas/WarmStartReport'
        comparison:
          $ref: '#/components/schemas/FemComparison'
    ModelGateReport:
      type: object
      description: |
        Отчёт о проверках-гейтах модели: физическая невязка, монотонность ВАХ,
        C²-непрерывность. Модель без пройденных гейтов не может быть `active`.
      required:
      - surrogate_id
      - passed
      - checks
      properties:
        surrogate_id:
          type: integer
          format: int64
        passed:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required:
            - name
            - passed
            properties:
              name:
                type: string
                enum:
                - physical_residual
                - monotonic_iv
                - c2_continuity
                - iterations_saved
                - val_mse
              passed:
                type: boolean
              value:
                type: number
                format: double
              threshold:
                type: number
                format: double
              detail:
                type: string
        checked_at:
          type: string
          format: date-time
    OnnxExportResult:
      type: object
      required:
      - surrogate_id
      - onnx_path
      properties:
        surrogate_id:
          type: integer
          format: int64
        onnx_path:
          type: string
        opset:
          type: integer
        size_bytes:
          type: integer
        parity_ok:
          type: boolean
          description: Результат проверки «ONNX ≈ PyTorch» на эталонном батче.
        max_abs_difference:
          type: number
          format: double
        exported_at:
          type: string
          format: date-time
    DeviceFamilyLabel:
      type: object
      description: Справочная запись семейства приборов.
      required:
      - device_id
      - display_name
      properties:
        device_id:
          $ref: '#/components/schemas/DeviceFamily'
        display_name:
          type: string
          examples:
          - FinFET
        solver_basis:
          type: string
          description: Основной вычислительный метод семейства.
          enum:
          - compact_model_fit
          - laplace_fem
          - geometric_fem
          - perimeter_fem
          - tunnel_field_fem
          - phenomenological_thermal_fem
          - state_model_ode
          - cad_mapping
          examples:
          - geometric_fem
        export_target:
          type: string
          description: Целевой формат экспорта (FR-EXP-01).
          enum:
          - bsim4_model
          - level72_model
          - behavioral_subckt
          - verilog_a
          - curve_metrics_json
          examples:
          - level72_model
        thermal_supported:
          type: boolean
          description: Поддерживается ли тепловой FEM для семейства.
        memory_device:
          type: boolean
          description: Относится ли семейство к устройствам памяти (гистерезис).
    SolverMethod:
      type: string
      description: Метод расчёта задачи.
      enum:
      - thermal_fem
      - laplace_fem
      - induction_analytic
      - quantum_poisson
      - reduced_order_pde
      - memory_state_ode
    JobKind:
      type: string
      description: Тип фоновой операции.
      enum:
      - compute
      - extraction_fit
      - verification
      - report
      - training
      - inference
      - import
    Severity:
      type: string
      enum:
      - info
      - warning
      - error
    Units:
      type: object
      description: |
        Единицы измерения величин. Физические значения всегда передаются в
        SI-производных единицах (м, В, А, Ф, Ом, К, с, Гц); `unit_scale`
        структуры задаёт масштаб CAD-геометрии.
      additionalProperties: true
      properties:
        length:
          type: string
          default: m
        voltage:
          type: string
          default: V
        current:
          type: string
          default: A
        capacitance:
          type: string
          default: F
        resistance:
          type: string
          default: ohm
        temperature:
          type: string
          default: K
        time:
          type: string
          default: s
        frequency:
          type: string
          default: Hz
    JobEvent:
      type: object
      description: Одно событие прогресса фоновой задачи (элемент SSE-потока или журнала).
      required:
      - sequence
      - job_id
      - kind
      - stage
      - status
      - progress
      - timestamp
      properties:
        sequence:
          type: integer
          format: int64
          description: Монотонный номер события внутри задачи (для переподключения SSE).
        job_id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/JobKind'
        stage:
          $ref: '#/components/schemas/JobStage'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Доля выполнения (0…1).
        message:
          type: string
          description: Человекочитаемое сообщение для строки состояния.
        severity:
          $ref: '#/components/schemas/Severity'
        metrics:
          type: object
          description: |
            Текущие показатели этапа: `residual`, `newton_iters`, `iterations`,
            `loss`, `eta_s`, `gpu_utilization_percent`, `vram_used_mb`.
          additionalProperties:
            type: number
            format: double
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          description: 'Переход к результату (например, `{ "session_id": 51 }`).'
          additionalProperties: true
    ErrorCode:
      type: string
      description: Машинный код ошибки. Используется GUI для выбора стратегии восстановления.
      enum:
      - VALIDATION_FAILED
      - FIELD_OUT_OF_RANGE
      - MISSING_GEOMETRY_FIELD
      - DEVICE_INVARIANT_VIOLATED
      - UNSUPPORTED_DEVICE_FAMILY
      - UNSUPPORTED_MEDIA_TYPE
      - UNSUPPORTED_UNIT
      - FILE_TOO_LARGE
      - INVALID_STL
      - EMPTY_MEASUREMENT
      - INVALID_MEASUREMENT_COLUMNS
      - INSUFFICIENT_SWEEPS
      - UNAUTHENTICATED
      - FORBIDDEN
      - RATE_LIMITED
      - NOT_FOUND
      - CONFLICT
      - VERSION_CONFLICT
      - INVALID_STATE
      - DUPLICATE_RESOURCE
      - IDEMPOTENCY_KEY_REUSED
      - VRAM_OUT_OF_MEMORY
      - NOT_CONVERGED
      - SINGULAR_MATRIX
      - MESH_BUDGET_EXCEEDED
      - SOLVER_UNAVAILABLE
      - SOLVER_TIMEOUT
      - SURROGATE_MISMATCH
      - EDA_TOOL_UNAVAILABLE
      - NETLIST_FAILED
      - COMPILE_FAILED
      - VERIFICATION_REJECTED
      - REPORT_RENDER_FAILED
      - TELEMETRY_UNAVAILABLE
      - JOB_CANCELLED
      - JOB_EXPIRED
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
    ProblemDetail:
      type: object
      description: Дополнительные поля ошибки, привязанные к конкретному параметру или записи.
      additionalProperties: true
      properties:
        field:
          type: string
          description: Имя поля запроса, к которому относится ошибка (dot-путь для вложенных).
          examples:
          - geometry.fin_pitch_nm
        value: {}
        allowed:
          type: array
          description: Допустимые значения (для перечислимых полей).
          items: {}
        requirements:
          type: array
          description: Ссылки на требования, нарушенные запросом.
          items:
            type: string
            pattern: ^(FR|NFR)-[A-Z]+-[0-9]{2}$
          examples:
          - - FR-IMP-02
    Problem:
      type: object
      description: |
        Тело ошибки по RFC 7807. Содержит человекочитаемое `detail` и машинный
        `code`; при ошибках валидации в `errors` перечислены все нарушения сразу,
        чтобы GUI мог подсветить все поля формы.
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          description: Ссылка на документацию класса ошибки.
          examples:
          - https://tspice.local/errors/VRAM_OUT_OF_MEMORY
        title:
          type: string
          description: Краткое описание класса ошибки (не для показа пользователю).
          examples:
          - Недостаточно видеопамяти
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-код ответа (дублируется для логирования).
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Человекочитаемое описание ошибки на языке пользователя.
          examples:
          - Требуемая матрица 1.9 ГБ превышает свободные 1.2 ГБ VRAM; включён CPU-бэкенд.
        instance:
          type: string
          description: URI запроса, вызвавшего ошибку.
          examples:
          - /api/v1/solver/fem-calculation
        request_id:
          type: string
          format: uuid
          description: Идентификатор обращения для поиска в журналах.
        errors:
          type: array
          description: Список конкретных нарушений (для 422).
          items:
            $ref: '#/components/schemas/ProblemDetail'
        required:
          type: array
          description: Требования, на которых основан отказ (для 409/422 расчётов).
          items:
            type: string
        retry_after_s:
          type: integer
          minimum: 0
          description: Рекомендуемая задержка повтора в секундах (для 429/503).
        fallback:
          type: object
          description: |
            Предложенная стратегия восстановления. Для VRAM_OUT_OF_MEMORY содержит
            `backend=cpu_scipy` (NFR-REL-03), для NOT_CONVERGED — уменьшенный
            `mesh_quality` или число узлов.
          additionalProperties: true
        job_id:
          type: integer
          format: int64
          description: Задача, к которой относится ошибка (если она возникла асинхронно).
        occurrences:
          type: integer
          minimum: 1
          description: Сколько раз ошибка повторилась внутри задачи.
        log_url:
          type: string
          description: Ссылка на фрагмент журнала задачи.
      additionalProperties: true
      examples:
      - type: https://tspice.local/errors/VRAM_OUT_OF_MEMORY
        title: Недостаточно видеопамяти
        status: 413
        code: VRAM_OUT_OF_MEMORY
        detail: Требуемая матрица 1.9 ГБ превышает свободные 1.2 ГБ VRAM; включён CPU-бэкенд.
        instance: /api/v1/solver/fem-calculation
        request_id: 0f0b6e6a-6f3c-4a63-9a5e-1d2f4f3a0b11
        fallback:
          backend: cpu_scipy

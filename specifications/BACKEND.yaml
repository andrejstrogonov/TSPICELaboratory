      - unit
      - instance_name
      properties:
        unit:
          type: string
          description: Единица измерения геометрии в файле.
          enum:
          - m
          - mm
          - nm
        instance_name:
          type: string
          description: Пользовательское имя структуры в системе.
          minLength: 1
          maxLength: 120
        device_family:
          type: string
          description: Семейство, к которому привязывается пользовательская структура.
          enum:
          - cad_custom
          default: cad_custom
        profile_id:
          type: integer
          format: int64
        physical_parameters:
          $ref: '#/components/schemas/PhysicalParameters'
        geometry:
          type: array
          description: Дополнительные параметры переноса поля на поверхность.
          items:
            $ref: '#/components/schemas/GeometryFieldValue'
        await_mesh:
          type: boolean
          default: false
          description: Дождаться предварительной сборки сетки (синхронный ответ 201).
    ParameterSetExport:
      type: object
      description: |
        Полный набор параметров структуры для экспорта в JSON-отчёт (FR-IMP-03):
        физические константы, геометрия, профиль и результаты последних расчётов.
      required:
      - format_version
      - structure
      - exported_at
      properties:
        format_version:
          type: string
          examples:
          - '1.0'
        structure:
          $ref: '#/components/schemas/DeviceStructure'
        profile:
          $ref: '#/components/schemas/Profile'
        solver_settings:
          type: object
          additionalProperties: true
        latest_results:
          type: object
          description: Идентификаторы последних задач и сессий для трассируемости.
          additionalProperties: true
        exported_at:
          type: string
          format: date-time
        exported_by:
          type: string
    GeometryRange:
      type: object
      description: |
        Диапазон допустимых значений поля для GUI-форм. Используется для
        динамической перенастройки QDoubleSpinBox.
      required:
      - field_id
      - min_value
      - max_value
      - default_value
      - unit
      properties:
        field_id:
          type: string
        min_value:
          type: number
          format: double
        max_value:
          type: number
          format: double
        default_value:
          type: number
          format: double
        unit:
          type: string
        decimals:
          type: integer
          minimum: 0
          default: 6
        integer_only:
          type: boolean
    MeasurementSource:
      type: string
      enum:
      - csv
      - whitespace_log
      - silvaco
      - sim_result
      - manual
    MeasurementSet:
      type: object
      description: Импортированный набор экспериментальных данных (FR-IMP-01).
      required:
      - set_id
      - structure_id
      - spec_id
      - points
      properties:
        set_id:
          type: integer
          format: int64
        structure_id:
          type: integer
          format: int64
        spec_id:
          type: string
          description: Идентификатор характеристики из characteristic_specs.
          examples:
          - idvg
        source:
          $ref: '#/components/schemas/MeasurementSource'
        source_path:
          type: string
        delimiter:
          type: string
          examples:
          - ;
        points:
          type: integer
          minimum: 0
        units_detected:
          type: object
          description: Распознанные единицы (В, А, Ф, Гц) по заголовкам колонок.
          additionalProperties:
            type: string
        columns:
          type: array
          description: Колонки файла в исходном порядке.
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              canonical:
                type: string
                description: Каноническая величина (gate_voltage, drain_current, ...).
              unit:
                type: string
        sweeps:
          type: array
          description: |
            Разбиение на свипы по фиксированным смещениям (например, разные Vd).
            Экстрактор выбирает свип по режиму (FR-EXT-02).
          items:
            type: object
            properties:
              index:
                type: integer
              points:
                type: integer
              drain_voltage:
                type: number
                format: double
              gate_bias:
                type: number
                format: double
        imported_at:
          type: string
          format: date-time
    MeasurementPoint:
      type: object
      required:
      - point_id
      - x
      - y
      properties:
        point_id:
          type: integer
          format: int64
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        bias:
          type: number
          format: double
          description: Смещение свипа (например, Vd для Id–Vg).
        extra:
          type: object
          description: Дополнительные колонки точки.
          additionalProperties:
            type: number
            format: double
    MeasurementPointsPage:
      type: object
      description: Страница точек кривой (таблица measurement_points).
      required:
      - set_id
      - offset
      - count
      - total
      properties:
        set_id:
          type: integer
          format: int64
        offset:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        points:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementPoint'
    MeasurementSetList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/MeasurementSet'
    MeasurementImportRequest:
      type: object
      description: |
        Метаданные импорта CSV (файл передаётся в multipart/form-data полем `file`).
        Сервер распознаёт размерности из заголовков (В, А, Ф, Гц) и раскладывает
        данные на свипы; при неудаче возвращает `INVALID_MEASUREMENT_COLUMNS`.
      required:
      - structure_id
      - spec_id
      properties:
        structure_id:
          type: integer
          format: int64
        spec_id:
          type: string
          examples:
          - idvg
        delimiter:
          type: string
          description: Разделитель (';', ',', tab, auto).
          default: auto
          enum:
          - auto
          - ','
          - ;
          - tab
          - space
        decimal_separator:
          type: string
          enum:
          - .
          - ','
          default: .
        device_count:
          type: integer
          description: |
            Сколько транзисторов группы содержит файл (для FR-EXT-02 — не менее 5).
            Проверяется при запуске сессии.
          minimum: 1
          maximum: 100
        label:
          type: string
        has_header:
          type: boolean
          default: true
    InitialGuess:
      type: object
      description: |
        Стартовое приближение (FR-EXT-01). VTH0 рассчитывается экстраполяцией
        максимальной крутизны gm, U0 — по максимуму gm; зашитые константы запрещены
        (поле `source` всегда `measured` или `surrogate`).
      required:
      - vth0
      - u0
      - source
      properties:
        vth0:
          type: number
          format: double
          description: Пороговое напряжение, В.
        u0:
          type: number
          format: double
          description: Эффективная подвижность, см²/(В·с).
        nfactor:
          type: number
          format: double
        gm_max:
          type: number
          format: double
          description: Максимальная крутизна, С.
        vg_at_gm_max:
          type: number
          format: double
        ss_mv_dec:
          type: number
          format: double
          description: Подпороговый размах, мВ/дек.
        source:
          type: string
          enum:
          - measured
          - surrogate
          - previous_session
        method:
          type: string
          enum:
          - max_gm_extrapolation
          - combined
    ExtractionAlgorithm:
      type: string
      description: |
        `BSIM4_STEPS` — пошаговый BSIM4 (FR-EXT-04), `CMG` — общая модель на группу
        приборов (co-model с W_eff), `BEHAVIORAL` — поведенческая `.subckt` для
        не-MOSFET семейств.
      enum:
      - BSIM4_STEPS
      - CMG
      - BEHAVIORAL
    ExtractionSessionCreate:
      type: object
      description: |
        Создание сессии многопараметрического фиттинга (FR-EXT-02). Сессия
        выполняется асинхронно: ответ 201 содержит `session_id` и `job_id`.
      required:
      - structure_ids
      properties:
        structure_ids:
          type: array
          description: |
            Группа транзисторов с разными L/W. Для `CMG` требуется не менее 5
            структур.
          minItems: 1
          maxItems: 50
          items:
            type: integer
            format: int64
        measurement_set_ids:
          type: array
          description: Наборы измерений той же длины, что `structure_ids` (или общий набор).
          items:
            type: integer
            format: int64
        characteristic_specs:
          type: array
          description: Характеристики, участвующие в подгонке.
          default:
          - idvg
          - idvd
          items:
            type: string
        algorithm:
          $ref: '#/components/schemas/ExtractionAlgorithm'
        algorithm_settings:
          type: object
          description: |
            Параметры `least_squares`: `loss`, `f_scale`, `xtol`, `ftol`, `gtol`,
            `max_nfev`, `bounds`, `subthreshold_weight`.
          additionalProperties: true
        use_pinn_acceleration:
          type: boolean
          description: Использовать суррогат для стартовых весов (NFR-PERF-03).
          default: false
        surrogate_model_id:
          type: integer
          format: int64
        initial_guess:
          type: object
          description: Ручное переопределение стартовых точек (необязательно).
          properties:
            vth0:
              type: number
              format: double
            u0:
              type: number
              format: double
        error_metric:
          type: object
          description: |
            Дифференцированная метрика ошибки (NFR-REL-01): log10 для подпороговой
            области, процент — для надпороговой.
          properties:
            subthreshold:
              type: string
              enum:
              - log10_rmse
              - relative_percent
              default: log10_rmse
            abovethreshold:
              type: string
              enum:
              - log10_rmse
              - relative_percent
              default: relative_percent
            subthreshold_weight:
              type: number
              format: float
              minimum: 0
              maximum: 1
              default: 0.5
        smoothing:
          type: object
          description: |
            Гладкие ёмкостные выражения (FR-EXT-03, NFR-REL-02): tanh/EKV вместо
            POLY(2), C¹/C²-непрерывность на диапазоне −5…+5 В.
          properties:
            form:
              type: string
              enum:
              - tanh
              - ekv
              default: tanh
            voltage_range_v:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
                format: double
              default:
              - -5
              - 5
    ExtractedParameter:
      type: object
      description: Извлечённый параметр карты (таблица `extracted_parameters`).
      required:
      - parameter_name
      - extracted_value
      properties:
        parameter_name:
          type: string
          examples:
          - VTH0
        extracted_value:
          type: number
          format: double
        unit:
          type: string
        step_no:
          type: integer
          description: Шаг BSIM4, на котором определён параметр (FR-EXT-04).
        bound_hit:
          type: boolean
          description: true — значение упёрлось в границу допустимого диапазона.
        lower_bound:
          type: number
          format: double
        upper_bound:
          type: number
          format: double
        standard_error:
          type: number
          format: double
        shared:
          type: boolean
          description: true — общий параметр группы приборов (FR-EXT-02).
    BsimStepReport:
      type: object
      description: Результат одного шага пошагового алгоритма BSIM4 (FR-EXT-04).
      required:
      - step_no
      - status
      properties:
        step_no:
          type: integer
          minimum: 1
          maximum: 6
        name:
          type: string
          examples:
          - Threshold and subthreshold
        status:
          type: string
          enum:
          - ok
          - bound_hit
          - skipped
          - failed
        parameters:
          type: array
          items:
            type: string
        cost_before:
          type: number
          format: double
        cost_after:
          type: number
          format: double
        iterations:
          type: integer
    ExtractionSession:
      type: object
      description: Сессия экстракции (таблица `extraction_sessions`).
      required:
      - session_id
      - status
      - algorithm
      properties:
        session_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
        structure_ids:
          type: array
          items:
            type: integer
            format: int64
        measurement_set_ids:
          type: array
          items:
            type: integer
            format: int64
        algorithm:
          $ref: '#/components/schemas/ExtractionAlgorithm'
        algorithm_settings:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/JobStatus'
        stage:
          $ref: '#/components/schemas/JobStage'
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
        initial_guess:
          $ref: '#/components/schemas/InitialGuess'
        pinn_applied:
          type: boolean
        iterations_count:
          type: integer
        cost:
          type: number
          format: double
          description: Финальное значение функции потерь.
        rmse_log10:
          type: number
          format: double
          description: RMSE по log10(Id) на обучающей выборке.
        final_mse_validation:
          type: number
          format: double
          description: |
            MSE на отложенной выборке от физического решателя (NFR-REL-04).
            Рассчитывается только на val-сплите.
        validation_split:
          type: object
          properties:
            train_points:
              type: integer
            validation_points:
              type: integer
            test_points:
              type: integer
            seed:
              type: integer
        parameters:
          type: array
          description: Текущий вектор извлечённых параметров.
          items:
            $ref: '#/components/schemas/ExtractedParameter'
        step_report:
          type: array
          description: Отчёт по шести шагам BSIM4 (FR-EXT-04).
          items:
            $ref: '#/components/schemas/BsimStepReport'
        spice_model_id:
          type:
          - integer
          - 'null'
          format: int64
        verification_run_ids:
          type: array
          items:
            type: integer
            format: int64
        warnings:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        elapsed_s:
          type: number
          format: double
    ExtractionSessionList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ExtractionSession'
    ExtractionSessionAccepted:
      type: object
      required:
      - session_id
      - job_id
      - status
      properties:
        session_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        initial_vth0:
          type: number
          format: double
          description: Стартовое приближение VTH0 по максимальной крутизне (FR-EXT-01).
        initial_u0:
          type: number
          format: double
          description: Стартовое приближение U0 (FR-EXT-01).
        events_url:
          type: string
        result_url:
          type: string
    ExtractionProgress:
      type: object
      description: Снимок хода итераций фиттинга (для графика сходимости в GUI).
      required:
      - session_id
      - status
      properties:
        session_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        stage:
          $ref: '#/components/schemas/JobStage'
        progress:
          type: number
          format: float
        iterations:
          type: integer
        cost:
          type: number
          format: double
        gradient_norm:
          type: number
          format: double
        active_parameters:
          type: array
          items:
            type: string
        history:
          type: array
          description: Траектория cost и ключевых параметров по итерациям.
          items:
            type: object
            properties:
              iteration:
                type: integer
              cost:
                type: number
                format: double
              vth0:
                type: number
                format: double
              u0:
                type: number
                format: double
        eta_s:
          type: number
          format: double
    CurveMetricValue:
      type: object
      description: Значение метрики кривой (metric_labels, 66 идентификаторов).
      required:
      - metric_id
      - value
      properties:
        metric_id:
          type: string
          examples:
          - ION
          - IOFF
          - SS_MV_DEC
        value:
          type:
          - number
          - 'null'
          format: double
          description: null — метрика не определена на данных.
        unit:
          type: string
        display_name:
          type: string
        group:
          type: string
          description: |
            Функциональная группа MF1…MF10 из D10_DEVICE_MATRIX:
            connection, transfer, output, capacitance, rf, switching, bjt,
            thermal, memory, quality.
          enum:
          - connection
          - transfer
          - output
          - capacitance
          - rf
          - switching
          - bjt
          - thermal
          - memory
          - quality
        measured:
          type: number
          format: double
        simulated:
          type: number
          format: double
        relative_error:
          type: number
          format: double
    CurveMetricsResult:
      type: object
      description: |
        Результат расчёта curve metrics по набору измерений. Для не-MOSFET семейств
        именно этот объект является содержанием экспорта (FR-EXP-01).
      required:
      - structure_id
      - metrics
      properties:
        structure_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        measurement_set_ids:
          type: array
          items:
            type: integer
            format: int64
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/CurveMetricValue'
        groups_summary:
          type: object
          description: Сводка по группам MF1…MF10 (количество определённых метрик).
          additionalProperties:
            type: integer
        fitness_score:
          type: number
          format: double
          description: Агрегированная оценка качества модели (0…1).
    MetricDefinition:
      type: object
      description: Определение метрики из справочника metric_labels.
      required:
      - metric_id
      - display_name
      properties:
        metric_id:
          type: string
        display_name:
          type: string
          examples:
          - Максимальная крутизна gm, С
        unit:
          type: string
        group:
          type: string
          enum:
          - connection
          - transfer
          - output
          - capacitance
          - rf
          - switching
          - bjt
          - thermal
          - memory
          - quality
        applicable_families:
          type: array
          items:
            $ref: '#/components/schemas/DeviceFamily'
        formula:
          type: string
          description: Текстовая формула или правило вычисления.
    SpiceModel:
      type: object
      description: Итоговая SPICE-карта (таблица `spice_models`).
      required:
      - model_id
      - session_id
      - model_type
      properties:
        model_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        structure_id:
          type: integer
          format: int64
        model_type:
          type: string
          enum:
          - bsim4_model
          - level72_model
          - behavioral_subckt
          - verilog_a
          - curve_metrics_json
        target_simulator:
          type: string
          enum:
          - ngspice
          - microcap
          - tanner
          - xyce
        level_correction:
          type: object
          description: |
            Автоматическая подмена номера уровня под целевую среду (NFR-COM-02):
            LEVEL=54 для ngspice, LEVEL=14 для Micro-Cap 12.
          properties:
            requested_level:
              type: integer
            applied_level:
              type: integer
        model_text:
          type: string
          description: Текст .model/.subckt. Для curve_metrics_json — пусто (см. `curve_metrics`).
        curve_metrics:
          $ref: '#/components/schemas/CurveMetricsResult'
        fitness_score:
          type: number
          format: double
        syntax_check:
          type: object
          description: Результат проверки парсинга целевыми симуляторами (NFR-COM-01).
          properties:
            ngspice_ok:
              type: boolean
            tanner_ok:
              type: boolean
            microcap_ok:
              type: boolean
            errors:
              type: array
              items:
                type: string
        emitted_at:
          type: string
          format: date-time
    SpiceModelList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/SpiceModel'
    SpiceExportRequest:
      type: object
      description: |
        Дифференцированный экспорт (FR-EXP-01): для planar_mosfet — полная карта
        BSIM4, для остальных семейств — JSON с curve metrics.
      required:
      - target
      properties:
        target:
          type: string
          description: Формат выгрузки.
          enum:
          - spice_model
          - curve_metrics_json
          - verilog_a
          - netlist_testbench
        simulator:
          type: string
          enum:
          - ngspice
          - microcap
          - tanner
          - xyce
          default: ngspice
        level:
          type: integer
          description: Запрошенный уровень модели (контракт вернёт применённый).
        include_testbench:
          type: boolean
          default: false
          description: Добавить нетлист-обвязку для сквозного прогона.
        include_parameters:
          type: boolean
          default: true
          description: Добавить комментарии с извлечёнными параметрами.
        curve_metrics_ids:
          type: array
          description: Ограничить набор метрик для JSON-выгрузки.
          items:
            type: string
    SpiceExportResponse:
      type: object
      required:
      - model_id
      - model_type
      - target
      - content
      properties:
        model_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        model_type:
          type: string
          enum:
          - bsim4_model
          - level72_model
          - behavioral_subckt
          - verilog_a
          - curve_metrics_json
        target:
          type: string
        mediator:
          type: string
          enum:
          - spice_model
          - curve_metrics_json
          - verilog_a
          - netlist_testbench
        content:
          type: string
          description: Текст карты, JSON-отчёт с метриками или нетлист.
        content_type:
          type: string
          enum:
          - text/plain
          - application/json
          - text/x-spice
          - text/x-verilog-a
        level_applied:
          type: integer
        warnings:
          type: array
          items:
            type: string
        download_url:
          type: string
    AnalysisReport:
      type: object
      description: |
        JSON-отчёт с результатами анализа (экспорт curve metrics и параметров).
        Структура совместима с FR-IMP-03 (импорт полного набора параметров).
      required:
      - format_version
      - structure
      - metrics
      properties:
        format_version:
          type: string
        structure:
          $ref: '#/components/schemas/DeviceStructure'
        session_id:
          type: integer
          format: int64
        extracted_parameters:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedParameter'
        metrics:
          $ref: '#/components/schemas/CurveMetricsResult'
        curves:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedCurve'
        verification:
          type: object
          additionalProperties: true
        generated_at:
          type: string
          format: date-time
    EdaSimulator:
      type: string
      enum:
      - ngspice
      - microcap
      - tanner
      - xyce
    EdaIntegration:
      type: object
      description: |
        Настройки подключения к EDA-симулятору (NFR-COM-01). Путь к исполняемому
        файлу хранится в конфигурации узла, секреты не возвращаются.
      required:
      - simulator
      - available
      properties:
        simulator:
          $ref: '#/components/schemas/EdaSimulator'
        executable_path:
          type: string
          maxLength: 512
        timeout_s:
          type: integer
          minimum: 1
          maximum: 3600
          default: 300
        available:
          type: boolean
          description: Симулятор отвечает на тестовую команду.
        version:
          type: string
          examples:
          - ngspice-42
        checked_at:
          type: string
          format: date-time
        detail:
          type: string
          description: Причина недоступности (`EDA_TOOL_UNAVAILABLE`).
    VerificationMode:
      type: string
      description: |
        `loopback` — самотестирование «генерация эталона → экстракция → сравнение»
        (FR-EXT-07); `hysteresis` — проверка петли гистерезиса мемристора
        (FR-EXT-05); `netlist` — сквозной прогон карты в EDA (FR-EXT-06);
        `syntax` — только синтаксический парсинг (NFR-COM-01).
      enum:
      - loopback
      - hysteresis
      - netlist
      - syntax
    VerificationStatus:
      type: string
      enum:
      - queued
      - running
      - passed
      - rejected
      - failed
      - cancelled
    VerificationRunRequest:
      type: object
      description: |
        Запуск верификации. Для FR-EXT-06 финальные параметры принимаются только
        по результатам этого прогона — сессия не переходит в `completed` без
        успешного этапа EDA.
      required:
      - mode
      - simulator
      properties:
        mode:
          $ref: '#/components/schemas/VerificationMode'
        simulator:
          $ref: '#/components/schemas/EdaSimulator'
        spice_model_id:
          type: integer
          format: int64
          description: Проверяемая карта; по умолчанию — последняя карта сессии.
        reference_model_id:
          type: integer
          format: int64
          description: Эталонная карта для loopback (FR-EXT-07).
        measurement_set_ids:
          type: array
          description: Наборы экспериментальных данных для сравнения.
          items:
            type: integer
            format: int64
        bias:
          type: object
          description: Условия прогона нетлиста.
          properties:
            vd_start:
              type: number
              format: double
              default: 0
            vd_stop:
              type: number
              format: double
              default: 1.2
            vg_start:
              type: number
              format: double
              default: -0.5
            vg_stop:
              type: number
              format: double
              default: 1.5
            points:
              type: integer
              minimum: 5
              maximum: 5001
              default: 101
            temperature_k:
              type: number
              format: double
              default: 300
            sweep_kind:
              type: string
              enum:
              - idvg
              - idvd
              - hysteresis
              default: idvg
        criteria:
          type: object
          description: Критерии приёмки модели.
          properties:
            max_relative_error:
              type: number
              format: float
              default: 0.15
              description: Порог максимальной относительной ошибки на вышепороговом участке.
            max_rmse_log10:
              type: number
              format: float
              default: 0.3
              description: Порог RMSE по log10(Id).
            require_hysteresis:
              type: boolean
              default: false
              description: |
                Для мемристоров — модель валидна только при петле-«восьмёрке»;
                вырождение в прямую линию отбраковывается (FR-EXT-05).
            min_hysteresis_area_av:
              type: number
              format: double
              default: 1.0e-09
            max_cycle_time_s:
              type: number
              format: double
              description: Ограничение времени цикла оптимизации и верификации, с (NFR-PERF-04 — 300 с).
              default: 300
        level_correction:
          type: boolean
          default: true
          description: Подменять LEVEL под выбранный симулятор (NFR-COM-02).
    VerificationRun:
      type: object
      description: Прогон верификации (таблица `verification_runs`).
      required:
      - run_id
      - session_id
      - mode
      - simulator
      - status
      properties:
        run_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        spice_model_id:
          type: integer
          format: int64
        mode:
          $ref: '#/components/schemas/VerificationMode'
        simulator:
          $ref: '#/components/schemas/EdaSimulator'
        status:
          $ref: '#/components/schemas/VerificationStatus'
        loop_area_a_v:
          type: number
          format: double
          description: Площадь петли гистерезиса, А·В.
        degenerate:
          type: boolean
          description: true — ВАХ выродилась в прямую линию (отбраковка).
        max_rel_error:
          type: number
          format: float
          description: Максимальная относительная ошибка на отложенной выборке.
        final_mse_validation:
          type: number
          format: double
          description: MSE на валидационной выборке от физического решателя (NFR-REL-04).
        rmse_log10:
          type: number
          format: double
        passed:
          type: boolean
        verdict:
          type: string
          enum:
          - VALID
          - REJECTED
          - INCONCLUSIVE
        level_applied:
          type: integer
        log_path:
          type: string
        log_url:
          type: string
        curves:
          type: array
          description: |
            Наложение расчётных и экспериментальных кривых для отчёта —
            `measured` и `simulated` в `columns`.
          items:
            $ref: '#/components/schemas/GeneratedCurve'
        criteria_evaluation:
          type: array
          description: Проверка каждого критерия приёмки.
          items:
            type: object
            required:
            - criterion
            - passed
            properties:
              criterion:
                type: string
                enum:
                - max_relative_error
                - rmse_log10
                - hysteresis_area
                - degeneracy
                - syntax
                - cycle_time
              threshold:
                type: number
                format: double
              actual:
                type: number
                format: double
              passed:
                type: boolean
        elapsed_s:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    VerificationRunList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/VerificationRun'
    VerificationAccepted:
      type: object
      required:
      - run_id
      - job_id
      - status
      properties:
        run_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/VerificationStatus'
        events_url:
          type: string
    VerilogACompileRequest:
      type: object
      description: |
        Компиляция Verilog-A модели в OSDI через OpenVAF (FR-EXT-05). Источник
        можно передать текстом или ссылкой на существующую карту сессии.
      properties:
        source:
          type: string
          description: Текст Verilog-A модуля.
          maxLength: 262144
        spice_model_id:
          type: integer
          format: int64
          description: Скомпилировать существующую карту (model_type=verilog_a).
        model_name:
          type: string
        optimization_level:
          type: integer
          enum:
          - 0
          - 1
          - 2
          default: 2
      oneOf:
      - required:
        - source
      - required:
        - spice_model_id
    VerilogACompileResult:
      type: object
      required:
      - status
      - module_name
      properties:
        status:
          type: string
          enum:
          - compiled
          - failed
        module_name:
          type: string
        osdi_path:
          type: string
        diagnostics:
          type: array
          items:
            type: object
            properties:
              severity:
                $ref: '#/components/schemas/Severity'
              line:
                type: integer
              column:
                type: integer
              message:
                type: string
              code:
                type: string
        osdi_capabilities:
          type: object
          description: Поддерживаемые опции OSDI (напряжения/токи доступа, шумы).
          additionalProperties: true
        elapsed_s:
          type: number
          format: double
    LoopbackRequest:
      type: object
      description: |
        Сквозное самотестирование (FR-EXT-07): эталонная карта → генерация ВАХ в
        ngspice → экстракция внутренним экстрактором → сравнение с эталоном.
      required:
      - reference_parameters
      properties:
        reference_parameters:
          type: object
          description: Эталонная карта параметров (известные VTH0, U0, NFACTOR, …).
          additionalProperties:
            type: number
            format: double
        device_family:
          $ref: '#/components/schemas/DeviceFamily'
          default: planar_mosfet
        simulator:
          $ref: '#/components/schemas/EdaSimulator'
          default: ngspice
        tolerance:
          type: number
          format: float
          description: Допустимое относительное отклонение извлечённых параметров.
          default: 0.1
        seed:
          type: integer
        sweep:
          type: object
          description: Условия прогона нетлиста.
          properties:
            vd_start:
              type: number
              format: double
              default: 0
            vd_stop:
              type: number
              format: double
              default: 1.2
            vg_start:
              type: number
              format: double
              default: -0.5
            vg_stop:
              type: number
              format: double
              default: 1.5
            points:
              type: integer
              minimum: 5
              maximum: 5001
              default: 101
            temperature_k:
              type: number
              format: double
              default: 300
            sweep_kind:
              type: string
              enum:
              - idvg
              - idvd
              - hysteresis
              default: idvg
    LoopbackResponse:
      type: object
      required:
      - run_id
      - status
      - comparisons
      properties:
        run_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/VerificationStatus'
        comparisons:
          type: array
          items:
            type: object
            required:
            - parameter
            - reference
            - extracted
            properties:
              parameter:
                type: string
              reference:
                type: number
                format: double
              extracted:
                type: number
                format: double
              relative_error:
                type: number
                format: double
              within_tolerance:
                type: boolean
        max_relative_error:
          type: number
          format: double
        elapsed_s:
          type: number
          format: double
    HysteresisValidation:
      type: object
      description: Результат валидатора петли гистерезиса мемристоров (FR-EXT-05).
      required:
      - valid
      - degenerate
      properties:
        valid:
          type: boolean
        degenerate:
          type: boolean
        loop_area_a_v:
          type: number
          format: double
        on_off_ratio:
          type: number
          format: double
        branches:
          type: integer
          description: Количество различимых ветвей петли.
        crossings:
          type: integer
          description: Число пересечений ветвей (0 — «восьмёрка» вырождена).
        reason:
          type: string
    ReportFormat:
      type: string
      enum:
      - pdf
      - latex
      - json
    Report:
      type: object
      description: Отчёт (таблица `reports`) — LaTeX-исходник и скомпилированный PDF.
      required:
      - report_id
      - session_id
      - status
      properties:
        report_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        run_id:
          type:
          - integer
          - 'null'
          format: int64
        structure_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        title:
          type: string
        format:
          $ref: '#/components/schemas/ReportFormat'
        renderer:
          type: string
          enum:
          - xelatex
          - pdflatex
          - reportlab
          - none
        latex_source:
          type: string
          description: Исходник LaTeX (доступен, если include_source=true).
        includes:
          type: object
          description: Состав отчёта.
          properties:
            parameters_table:
              type: boolean
            overlay_plots:
              type: boolean
            curve_metrics:
              type: boolean
            convergence_plots:
              type: boolean
            verification_log:
              type: boolean
        pdf:
          type: object
          description: Метаданные PDF-файла.
          properties:
            size_bytes:
              type: integer
              format: int64
            checksum:
              type: string
            pages:
              type: integer
            download_url:
              type: string
        figures:
          type: array
          description: Графики наложения расчётных и экспериментальных кривых.
          items:
            type: object
            properties:
              name:
                type: string
              spec_id:
                type: string
              download_url:
                type: string
        generated_at:
          type: string
          format: date-time
        elapsed_s:
          type: number
          format: double
    ReportList:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Report'
    ReportRequest:
      type: object
      description: |
        Генерация LaTeX-отчёта по завершении цикла оптимизации (NFR-USA-01):
        финальные таблицы параметров и графики наложения кривых.
      required:
      - session_id
      properties:
        session_id:
          type: integer
          format: int64
        verification_run_id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 120
        include:
          type: object
          properties:
            parameters_table:
              type: boolean
              default: true
            overlay_plots:
              type: boolean
              default: true
            curve_metrics:
              type: boolean
              default: true
            convergence_plots:
              type: boolean
              default: true
            verification_log:
              type: boolean
              default: true
        format:
          $ref: '#/components/schemas/ReportFormat'
          default: pdf
        renderer:
          type: string
          enum:
          - xelatex
          - pdflatex
          - reportlab
          default: xelatex
        language:
          type: string
          enum:
          - ru
          - en
          default: ru
    TelemetrySnapshot:
      type: object
      description: |
        Оперативная телеметрия GPU хоста (FR-GUI-03). Снимается через nvidia-smi или
        PyTorch и обновляется в интерфейсе раз в секунду.
      required:
      - gpu_utilization_percent
      - vram_used_mb
      - temperature_celsius
      - timestamp
      properties:
        gpu_utilization_percent:
          type: integer
          minimum: 0
          maximum: 100
        vram_used_mb:
          type: integer
          minimum: 0
        vram_total_mb:
          type: integer
          minimum: 0
        temperature_celsius:
          type: integer
        gpu_name:
          type: string
          examples:
          - NVIDIA GeForce RTX 4090
        power_w:
          type: number
          format: double
        fan_percent:
          type: integer
        clock_mhz:
          type: integer
        cuda_available:
          type: boolean
        cuda_version:
          type: string
        driver_version:
          type: string
        torch_fp64_available:
          type: boolean
        source:
          type: string
          enum:
          - nvidia_smi
          - torch
          - unavailable
        timestamp:
          type: string
          format: date-time
    NodeTelemetry:
      type: object
      description: 'Телеметрия узла: CPU, память, диск (для контроля NFR-PERF-04).'
      required:
      - cpu_percent
      - memory_used_mb
      - timestamp
      properties:
        cpu_percent:
          type: number
          format: float
        cpu_count:
          type: integer
        load_average:
          type: array
          items:
            type: number
            format: float
        memory_used_mb:
          type: number
          format: double
        memory_total_mb:
          type: number
          format: double
        disk_free_gb:
          type: number
          format: double
        active_jobs:
          type: integer
        queued_jobs:
          type: integer
        timestamp:
          type: string
          format: date-time
    TelemetryStreamFrame:
      type: object
      description: Кадр SSE-потока телеметрии (частый опрос для панели GPU).
      required:
      - sequence
      - timestamp
      properties:
        sequence:
          type: integer
          format: int64
        gpu:
          $ref: '#/components/schemas/TelemetrySnapshot'
        node:
          $ref: '#/components/schemas/NodeTelemetry'
        timestamp:
          type: string
          format: date-time
    ValidationError:
      description: Ошибка валидации запроса (422) с перечнем нарушений.
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            description: Все нарушения сразу, чтобы GUI подсветил все поля формы.
            items:
              $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: Некорректный синтаксис или неподдерживаемый формат.
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed:
              value:
                type: https://tspice.local/errors/VALIDATION_FAILED
                title: Некорректный запрос
                status: 400
                code: VALIDATION_FAILED
                detail: Тело запроса не является корректным JSON.
                request_id: 5b1b0f34-4b7c-4b0e-9c3f-1a2b3c4d5e6f
    Unauthorized:
      description: Отсутствует или недействителен токен/ключ.
      headers:
        WWW-Authenticate:
          description: Схема авторизации.
          schema:
            type: string
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Недостаточно прав на операцию над ресурсом.
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не найден.
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://tspice.local/errors/NOT_FOUND
                title: Ресурс не найден
                status: 404
                code: NOT_FOUND
                detail: Структура 4242 не существует или была удалена.
                request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Conflict:
      description: Конфликт состояния или версий (409).
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
        ETag:
          description: Актуальная версия ресурса.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Семантическая ошибка домена — инварианты структуры, диапазоны, режимы.
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            invariant:
              value:
                type: https://tspice.local/errors/DEVICE_INVARIANT_VIOLATED
                title: Нарушен инвариант структуры
                status: 422
                code: DEVICE_INVARIANT_VIOLATED
                detail: Шаг fin не может быть меньше ширины fin.
                request_id: 3d2b1a0c-9e8f-4d3c-b2a1-001122334455
                errors:
                - field: geometry.fin_pitch_nm
                  value: 20
                  allowed:
                  - 30
                  - 1000000
                  requirements:
                  - FR-CORE-01
    PayloadTooLarge:
      description: |
        Превышен лимит размера файла или памяти узла (413). Частный случай —
        исключение CUDA OOM на хосте, когда резервный CPU-решатель тоже
        перегружен (NFR-REL-03).
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            vram:
              value:
                type: https://tspice.local/errors/VRAM_OUT_OF_MEMORY
                title: Недостаточно видеопамяти
                status: 413
                code: VRAM_OUT_OF_MEMORY
                detail: CPU-решатель также перегружен; задача остановлена.
                request_id: 0f0b6e6a-6f3c-4a63-9a5e-1d2f4f3a0b11
                fallback:
                  backend: cpu_scipy
    TooManyRequests:
      description: Превышен лимит частоты запросов.
      headers:
        Retry-After:
          description: Секунды до повтора.
          schema:
            type: integer
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутренняя ошибка сервера.
      headers:
        X-Request-Id:
          description: Идентификатор запроса для трассировки (NFR-REL-02).
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Сервис или внешняя зависимость недоступны (EDA, GPU-нода).
      headers:
        Retry-After:
          description: Секунды до повтора.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    X-Request-Id:
      description: Идентификатор запроса для трассировки (NFR-REL-02).
      schema:
        type: string
        format: uuid
    ETag:
      description: Версия ресурса для оптимистичной блокировки (`If-Match`).
      schema:
        type: string
    Location:
      description: Канонический URL созданного ресурса.
      schema:
        type: string
        format: uri-reference
    X-RateLimit-Remaining:
      description: Остаток квоты запросов в текущем окне.
      schema:
        type: integer
        minimum: 0
  parameters:
    Page:
      name: page
      in: query
      description: Номер страницы (с нуля).
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: page_size
      in: query
      description: Размер страницы.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      description: |
        Поле сортировки, префикс «-» — по убыванию.
        Допустимые поля перечисляются в описании каждой операции.
      required: false
      schema:
        type: string
        maxLength: 64
    Search:
      name: search
      in: query
      description: Поиск по имени (подстрока, без учёта регистра).
      required: false
      schema:
        type: string
        maxLength: 128
    StructureIdPath:
      name: structure_id
      in: path
      description: Идентификатор экземпляра структуры.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProfileIdPath:
      name: profile_id
      in: path
      description: Идентификатор профиля семейства.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskIdPath:
      name: task_id
      in: path
      description: Идентификатор задачи расчёта.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SessionIdPath:
      name: session_id
      in: path
      description: Идентификатор сессии экстракции.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    JobIdPath:
      name: job_id
      in: path
      description: Идентификатор фоновой задачи.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MeasurementSetIdPath:
      name: set_id
      in: path
      description: Идентификатор набора измерений.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SpiceModelIdPath:
      name: model_id
      in: path
      description: Идентификатор SPICE-карты.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    VerificationRunIdPath:
      name: run_id
      in: path
      description: Идентификатор прогона верификации.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ReportIdPath:
      name: report_id
      in: path
      description: Идентификатор отчёта.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SurrogateModelIdPath:
      name: surrogate_id
      in: path
      description: Идентификатор суррогатной модели.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TrainingRunIdPath:
      name: training_id
      in: path
      description: Идентификатор прогона обучения.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeviceFamilyQuery:
      name: device_family
      in: query
      description: Фильтр по семейству прибора.
      required: false
      schema:
        type: string
        enum:
        - planar_mosfet
        - fd_soi
        - finfet
        - gaa_nanosheet
        - gaa_nanowire
        - tfet
        - hemt
        - memristor
        - memtransistor
        - cad_custom
    StatusQuery:
      name: status
      in: query
      description: Фильтр по статусу ресурса.
      required: false
      schema:
        type: string
        enum:
        - queued
        - running
        - ok
        - failed
        - cancelled
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Ключ идемпотентности длительных операций (UUID). Повторный запрос с тем же
        ключом возвращает ранее созданную задачу вместо новой (защита от дублей
        при ретраях GUI).
      required: false
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      description: |
        Оптимистичная блокировка: значение `ETag` из ETag ресурса.
        Несовпадение даёт `409 VERSION_CONFLICT`.
      required: false
      schema:
        type: string
        maxLength: 128
    XRequestId:
      name: X-Request-Id
      in: header
      description: |
        Идентификатор обращения для сквозной трассировки. Если не задан,
        генерируется сервером и возвращается в ответе и в теле ошибки.
      required: false
      schema:
        type: string
        format: uuid
    SinceStream:
      name: since
      in: query
      description: |
        Необязательный возврат журнала с указанной позиции (`sequence`).
        Используется при переподключении SSE-потока.
      required: false
      schema:
        type: integer
        minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Токен доступа инженера (роль определяет доступ к расчётным операциям:
        `viewer` — чтение справочников и результатов, `engineer` — запуск
        расчётов и экстракции, `admin` — конфигурация интеграций и обучение AI).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Сервисный ключ для автоматизации (Jenkins, ночные прогоны, внешние скрипты).
        Обладает правами `engineer` в пределах разрешённых проектов.

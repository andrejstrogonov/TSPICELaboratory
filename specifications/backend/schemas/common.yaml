# =============================================================================
# Общие модели данных: перечисления, постраничные ответы, задания, ресурсы
# =============================================================================
schemas:
  DeviceFamily:
    type: string
    description: Семейство полупроводникового прибора (device_labels, 10 записей).
    enum: [planar_mosfet, fd_soi, finfet, gaa_nanosheet, gaa_nanowire, tfet, hemt, memristor, memtransistor, cad_custom]
  DeviceFamilyLabel:
    type: object
    description: Справочная запись семейства приборов.
    required: [device_id, display_name]
    properties:
      device_id:
        $ref: '#/DeviceFamily'
      display_name:
        type: string
        examples: ['FinFET']
      solver_basis:
        type: string
        description: Основной вычислительный метод семейства.
        enum: [compact_model_fit, laplace_fem, geometric_fem, perimeter_fem, tunnel_field_fem, phenomenological_thermal_fem, state_model_ode, cad_mapping]
        examples: [geometric_fem]
      export_target:
        type: string
        description: Целевой формат экспорта (FR-EXP-01).
        enum: [bsim4_model, level72_model, behavioral_subckt, verilog_a, curve_metrics_json]
        examples: [level72_model]
      thermal_supported:
        type: boolean
        description: Поддерживается ли тепловой FEM для семейства.
      memory_device:
        type: boolean
        description: Относится ли семейство к устройствам памяти (гистерезис).
  MeshQuality:
    type: string
    description: |
      Пресет качества расчётной сетки. `custom` требует явных размеров в
      `grid_shape` (FR-CORE-01).
    enum: [rough, optimal, precise, custom]
  ComputeBackend:
    type: string
    description: |
      Вычислительный бэкенд. Порядок предпочтения: `cuda_fp64` → `cpu_scipy`;
      `rust_native` — нативное ядро (PyO3 + ONNX Runtime) для warm start,
      `cpu_torch` — резервный torch-путь quantum-Poisson.
    enum: [cuda_fp64, cpu_scipy, cpu_torch, rust_native]
  SolverMethod:
    type: string
    description: Метод расчёта задачи.
    enum: [thermal_fem, laplace_fem, induction_analytic, quantum_poisson, reduced_order_pde, memory_state_ode]
  FieldQuantity:
    type: string
    description: |
      Физическая величина поля. `T` — температура (FR-CORE-02),
      `V` — потенциал, `|E|` — модуль напряжённости (FR-CORE-03),
      `Az` — векторный потенциал, `B` — магнитная индукция (FR-CORE-04),
      `n`/`p` — концентрации носителей (quantum-Poisson).
    enum: [T, V, 'E', Az, B, n, p, dT]
  JobStatus:
    type: string
    description: |
      Состояние фоновой задачи. Терминальные состояния: `ok`, `failed`,
      `cancelled`. `queued` → `running` → терминальное.
    enum: [queued, running, ok, failed, cancelled]
  JobKind:
    type: string
    description: Тип фоновой операции.
    enum: [compute, extraction_fit, verification, report, training, inference, import]
  JobStage:
    type: string
    description: Этап задачи, отображаемый в прогресс-баре GUI.
    enum:
      - queue
      - mesh_generation
      - assemble
      - solve
      - postprocess
      - warm_start
      - fitting
      - spice_steps
      - compile_verilog_a
      - netlist_synthesis
      - eda_simulation
      - loopback_compare
      - latex_render
      - pdf_compile
      - training_epoch
      - onnx_export
  Severity:
    type: string
    enum: [info, warning, error]
  Units:
    type: object
    description: |
      Единицы измерения величин. Физические значения всегда передаются в
      SI-производных единицах (м, В, А, Ф, Ом, К, с, Гц); `unit_scale`
      структуры задаёт масштаб CAD-геометрии.
    additionalProperties: true
    properties:
      length:
        type: string
        default: m
      voltage:
        type: string
        default: V
      current:
        type: string
        default: A
      capacitance:
        type: string
        default: F
      resistance:
        type: string
        default: ohm
      temperature:
        type: string
        default: K
      time:
        type: string
        default: s
      frequency:
        type: string
        default: Hz
  AxisArray:
    type: object
    description: |
      Одна ось сетки (равномерная или адаптивно сгущённая). Порядок элементов
      соответствует порядку элементов `FieldMapData.values`.
    required: [name, values, unit]
    properties:
      name:
        type: string
        enum: [x, y, z, time, frequency]
      values:
        type: array
        description: Координаты узлов по возрастанию.
        minItems: 2
        items:
          type: number
          format: double
      unit:
        type: string
        examples: [m]
  JobEvent:
    type: object
    description: Одно событие прогресса фоновой задачи (элемент SSE-потока или журнала).
    required: [sequence, job_id, kind, stage, status, progress, timestamp]
    properties:
      sequence:
        type: integer
        format: int64
        description: Монотонный номер события внутри задачи (для переподключения SSE).
      job_id:
        type: integer
        format: int64
      kind:
        $ref: '#/JobKind'
      stage:
        $ref: '#/JobStage'
      status:
        $ref: '#/JobStatus'
      progress:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Доля выполнения (0…1).
      message:
        type: string
        description: Человекочитаемое сообщение для строки состояния.
      severity:
        $ref: '#/Severity'
      metrics:
        type: object
        description: |
          Текущие показатели этапа: `residual`, `newton_iters`, `iterations`,
          `loss`, `eta_s`, `gpu_utilization_percent`, `vram_used_mb`.
        additionalProperties:
          type: number
          format: double
      timestamp:
        type: string
        format: date-time
      payload:
        type: object
        description: Переход к результату (например, `{ "session_id": 51 }`).
        additionalProperties: true
  Job:
    type: object
    description: Фоновая задача — единица прогресса для длительных операций.
    required: [job_id, kind, status, progress, created_at]
    properties:
      job_id:
        type: integer
        format: int64
      kind:
        $ref: '#/JobKind'
      status:
        $ref: '#/JobStatus'
      stage:
        $ref: '#/JobStage'
      progress:
        type: number
        format: float
        minimum: 0
        maximum: 1
      message:
        type: string
      owner:
        type: string
        description: Пользователь, запустивший задачу.
      request:
        type: object
        description: Нормализованный запрос, породивший задачу (для повтора).
        additionalProperties: true
      results:
        type: object
        description: |
          Ссылки на результат в терминальном состоянии:
          `task_id`, `session_id`, `run_id`, `report_id`, `training_id`.
        additionalProperties: true
      last_event:
        $ref: '#/JobEvent'
      error:
        $ref: 'errors.yaml#/Problem'
      created_at:
        type: string
        format: date-time
      started_at:
        type: string
        format: date-time
        nullable: true
      finished_at:
        type: string
        format: date-time
        nullable: true
      elapsed_s:
        type: number
        format: double
        description: Длительность выполнения, с. Используется для контроля NFR-PERF-04.
      cancel_requested:
        type: boolean
  JobList:
    allOf:
      - $ref: '#/PageMeta'
      - type: object
        required: [items]
        properties:
          items:
            type: array
            items:
              $ref: '#/Job'
  PageMeta:
    type: object
    description: Метаданные страницы (курсорная и offset-пагинация поддерживаются одновременно).
    required: [page, page_size, total_items]
    properties:
      page:
        type: integer
        minimum: 0
      page_size:
        type: integer
        minimum: 1
      total_items:
        type: integer
        minimum: 0
      total_pages:
        type: integer
        minimum: 0
      sort:
        type: string
        description: Применённая сортировка (с префиксом «-» для убывания).
      next_cursor:
        type: string
        nullable: true
        description: Курсор следующей страницы (для больших перечислений).
  HealthStatus:
    type: object
    description: Состояние сервиса и его зависимостей.
    required: [status, version, uptime_s, checks]
    properties:
      status:
        type: string
        enum: [ok, degraded, down]
      version:
        type: string
        examples: ['1.0.0']
      api_version:
        type: string
        examples: ['v1']
      openapi_version:
        type: string
        examples: ['3.1.0']
      uptime_s:
        type: number
        format: double
      checks:
        type: array
        items:
          type: object
          required: [name, status]
          properties:
            name:
              type: string
              enum: [database, storage, cuda, gpu_node, ngspice, microcap_cli, openvaf, onnx_runtime, latex]
            status:
              type: string
              enum: [ok, degraded, down, disabled]
            detail:
              type: string
            latency_ms:
              type: number
              format: double
      git_commit:
        type: string
        description: Коммит сборки (проставляется CI, раздел «Сборка и артефакты»).
  FieldError:
    type: object
    required: [field, code]
    properties:
      field:
        type: string
      code:
        type: string
        enum: [required, unknown, out_of_range, not_integer, not_finite, non_positive, non_negative, sign_mismatch, ordering, length_mismatch, unsupported]
      message:
        type: string
      range:
        type: array
        description: '[min, max] из geometry_fields.'
        minItems: 2
        maxItems: 2
        items:
          type: number
          format: double
  ValidationReport:
    type: object
    description: Результат проверки структуры без сохранения.
    required: [valid, errors]
    properties:
      valid:
        type: boolean
      errors:
        type: array
        items:
          $ref: '#/FieldError'
      warnings:
        type: array
        items:
          $ref: '#/FieldError'
      effective_width_um:
        type: number
        format: double
        description: W_eff по геометрии (N·(2H+W), π·D·N и т. п.).
      capabilities:
        $ref: 'device.yaml#/DeviceCapabilities'
  ResourcePointer:
    type: object
    description: Ссылка на созданный ресурс.
    required: [id, href]
    properties:
      id:
        type: integer
        format: int64
      href:
        type: string

# =============================================================================
# Схемы безопасности и сквозная трассировка
# =============================================================================
securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
    description: |
      Токен доступа инженера (роль определяет доступ к расчётным операциям:
      `viewer` — чтение справочников и результатов, `engineer` — запуск
      расчётов и экстракции, `admin` — конфигурация интеграций и обучение AI).
  apiKeyAuth:
    type: apiKey
    in: header
    name: X-Api-Key
    description: |
      Сервисный ключ для автоматизации (Jenkins, ночные прогоны, внешние скрипты).
      Обладает правами `engineer` в пределах разрешённых проектов.

paths: {}

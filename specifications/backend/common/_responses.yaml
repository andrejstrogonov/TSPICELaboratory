# =============================================================================
# Переиспользуемые ответы и заголовки (внутренний модуль спецификации).
# Собирается build_backend_spec.py в components/responses и components/headers;
# НЕ попадает в итоговый BACKEND.yaml как отдельный файл.
# =============================================================================
responses:
  BadRequest:
    description: Некорректный синтаксис или неподдерживаемый формат.
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
        examples:
          malformed:
            value:
              type: https://tspice.local/errors/VALIDATION_FAILED
              title: Некорректный запрос
              status: 400
              code: VALIDATION_FAILED
              detail: Тело запроса не является корректным JSON.
              request_id: 5b1b0f34-4b7c-4b0e-9c3f-1a2b3c4d5e6f
  Unauthorized:
    description: Отсутствует или недействителен токен/ключ.
    headers:
      WWW-Authenticate:
        description: Схема авторизации.
        schema:
          type: string
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
  Forbidden:
    description: Недостаточно прав на операцию над ресурсом.
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
  NotFound:
    description: Ресурс не найден.
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
        examples:
          missing:
            value:
              type: https://tspice.local/errors/NOT_FOUND
              title: Ресурс не найден
              status: 404
              code: NOT_FOUND
              detail: Структура 4242 не существует или была удалена.
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  Conflict:
    description: Конфликт состояния или версий (409).
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
      ETag:
        description: Актуальная версия ресурса.
        schema:
          type: string
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
  UnprocessableEntity:
    description: Семантическая ошибка домена — инварианты структуры, диапазоны, режимы.
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/ValidationError'
        examples:
          invariant:
            value:
              type: https://tspice.local/errors/DEVICE_INVARIANT_VIOLATED
              title: Нарушен инвариант структуры
              status: 422
              code: DEVICE_INVARIANT_VIOLATED
              detail: Шаг fin не может быть меньше ширины fin.
              request_id: 3d2b1a0c-9e8f-4d3c-b2a1-001122334455
              errors:
                - field: geometry.fin_pitch_nm
                  value: 20
                  allowed: [30, 1000000]
                  requirements: [FR-CORE-01]
  PayloadTooLarge:
    description: |
      Превышен лимит размера файла или памяти узла (413). Частный случай —
      исключение CUDA OOM на хосте, когда резервный CPU-решатель тоже
      перегружен (NFR-REL-03).
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
        examples:
          vram:
            value:
              type: https://tspice.local/errors/VRAM_OUT_OF_MEMORY
              title: Недостаточно видеопамяти
              status: 413
              code: VRAM_OUT_OF_MEMORY
              detail: CPU-решатель также перегружен; задача остановлена.
              request_id: 0f0b6e6a-6f3c-4a63-9a5e-1d2f4f3a0b11
              fallback:
                backend: cpu_scipy
  TooManyRequests:
    description: Превышен лимит частоты запросов.
    headers:
      Retry-After:
        description: Секунды до повтора.
        schema:
          type: integer
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
  InternalError:
    description: Внутренняя ошибка сервера.
    headers:
      X-Request-Id:
        $ref: 'common/headers.yaml#/headers/X-Request-Id'
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'
  ServiceUnavailable:
    description: Сервис или внешняя зависимость недоступны (EDA, GPU-нода).
    headers:
      Retry-After:
        description: Секунды до повтора.
        schema:
          type: integer
    content:
      application/problem+json:
        schema:
          $ref: 'common/errors.yaml#/Problem'

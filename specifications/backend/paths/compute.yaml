# =============================================================================
# Compute · задачи расчёта D1: FEM, quantum-Poisson, PDE, state-модели, поля
# =============================================================================
paths:
  /solver/fem:
    post:
      tags: [Compute]
      summary: FEM-расчёт (тепло, электрика, индукция)
      description: |
        Запускает 3D FEM-задачу (FR-CORE-02/03/04). По умолчанию возвращает
        `202` с задачей в очереди; `Prefer: respond-async=false` включает
        синхронный экспресс-режим для коротких сеток. Суррогат даёт только
        стартовый вектор, точность обеспечивает детерминированный решатель.
      operationId: createFemCalculation
      parameters:
        - $ref: 'common/parameters.yaml#/IdempotencyKey'
        - $ref: 'common/parameters.yaml#/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/FemCalculationRequest'
      responses:
        '200':
          description: Синхронный результат экспресс-расчёта.
          headers:
            X-RateLimit-Remaining:
              $ref: 'common/headers.yaml#/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/FemCalculationResponse'
        '202':
          description: Задача принята в очередь расчёта.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/FemCalculationAccepted'
        '413':
          $ref: 'common/_responses.yaml#/PayloadTooLarge'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
        '429':
          $ref: 'common/_responses.yaml#/TooManyRequests'
        '500':
          $ref: 'common/_responses.yaml#/InternalError'
        '503':
          $ref: 'common/_responses.yaml#/ServiceUnavailable'
  /solver/quantum-poisson:
    post:
      tags: [Compute]
      summary: Самосогласованный расчёт Пуассона–Шрёдингера
      description: |
        Reduced-order модель с эффективной массой и конфайнментом (не
        неравновесный TCAD). Асинхронный запуск, как и FEM.
      operationId: createQuantumPoissonCalculation
      parameters:
        - $ref: 'common/parameters.yaml#/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/QuantumPoissonRequest'
      responses:
        '200':
          description: Решение самосогласованной задачи (экспресс-режим).
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/QuantumPoissonResponse'
        '202':
          description: Задача принята в очередь.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/FemCalculationAccepted'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /solver/pde-characteristics:
    post:
      tags: [Compute]
      summary: Характеристики по reduced-order PDE
      description: |
        Семейства ВАХ/ВФХ по модели плавного канала (`Cgg = dQg/dVg`) — быстрый
        предварительный расчёт перед экстракцией.
      operationId: createPdeCharacteristics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/PdeCharacteristicsRequest'
      responses:
        '200':
          description: Сгенерированные кривые.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/PdeCharacteristicsResponse'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /solver/memory-characteristics:
    post:
      tags: [Compute]
      summary: Кривые memristor / memtransistor
      description: |
        State-модель памяти: гистерезисные I–V, R–t и Id–Vg по модели с
        внутренним состоянием x(t) и порогами SET/RESET.
      operationId: createMemoryCharacteristics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/MemoryCharacteristicsRequest'
      responses:
        '200':
          description: Кривые памяти и диагностика модели.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/MemoryCharacteristicsResponse'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /solver/characteristics/batch:
    post:
      tags: [Compute]
      summary: Пакетный расчёт характеристик семейства
      description: Один запрос запускает весь набор характеристик структуры.
      operationId: createCharacteristicsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/CharacteristicsBatchRequest'
      responses:
        '200':
          description: Наборы кривых по каждой характеристике.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/CharacteristicsBatchResponse'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /solver/mesh-estimate:
    post:
      tags: [Compute]
      summary: Оценка бюджета сетки и памяти
      description: |
        Предварительная оценка числа узлов и памяти (FR-CORE-01, NFR-REL-03).
        GUI предупреждает пользователя, если расчёт не помещается в VRAM.
      operationId: estimateMeshBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/MeshEstimateRequest'
      responses:
        '200':
          description: Оценка бюджета.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/MemoryEstimate'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /solver/tasks:
    get:
      tags: [Compute]
      summary: Журнал задач расчёта
      operationId: listSolverTasks
      parameters:
        - name: structure_id
          in: query
          description: Фильтр по экземпляру структуры.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: 'common/parameters.yaml#/StatusQuery'
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
      responses:
        '200':
          description: Страница задач расчёта.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/SolverTaskList'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
  /solver/tasks/{task_id}:
    get:
      tags: [Compute]
      summary: Задача расчёта с журналом сходимости
      operationId: getSolverTask
      parameters:
        - $ref: 'common/parameters.yaml#/TaskIdPath'
      responses:
        '200':
          description: Задача расчёта и отчёт о сходимости.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/SolverTask'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /solver/tasks/{task_id}/cancel:
    post:
      tags: [Compute]
      summary: Отменить задачу расчёта
      description: Освобождает VRAM и удаляет промежуточные данные, если запрошено.
      operationId: cancelSolverTask
      parameters:
        - $ref: 'common/parameters.yaml#/TaskIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/TaskCancelRequest'
      responses:
        '202':
          description: Отмена принята.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/SolverTask'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '409':
          $ref: 'common/_responses.yaml#/Conflict'
  /solver/tasks/{task_id}/fields/{quantity}:
    get:
      tags: [Compute]
      summary: Карта поля задачи
      description: |
        Метаданные карты и (для небольших сеток) значения. Большие карты
        запрашиваются постранично через `/fields/{quantity}/pages`.
      operationId: getTaskFieldMap
      parameters:
        - $ref: 'common/parameters.yaml#/TaskIdPath'
        - name: quantity
          in: path
          required: true
          description: Физическая величина поля.
          schema:
            $ref: 'schemas/common.yaml#/FieldQuantity'
      responses:
        '200':
          description: Карта поля.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/FieldMap'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /solver/tasks/{task_id}/fields/{quantity}/pages:
    get:
      tags: [Compute]
      summary: Страница значений большой карты
      operationId: getTaskFieldMapPage
      parameters:
        - $ref: 'common/parameters.yaml#/TaskIdPath'
        - name: quantity
          in: path
          required: true
          description: Физическая величина поля.
          schema:
            $ref: 'schemas/common.yaml#/FieldQuantity'
        - name: offset
          in: query
          description: Начальный индекс значений.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: count
          in: query
          description: Размер страницы значений.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 65536
      responses:
        '200':
          description: Страница значений с указателем следующей.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/FieldMapPage'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /solver/tasks/{task_id}/fields/interpolate:
    post:
      tags: [Compute]
      summary: Интерполяция поля в точке
      description: |
        Значение поля в произвольной точке (FR-GUI-05) — для отображения значения
        под курсором на 3D-виде.
      operationId: interpolateFieldValue
      parameters:
        - $ref: 'common/parameters.yaml#/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/compute.yaml#/FieldInterpolationQuery'
      responses:
        '200':
          description: Интерполированное значение и признак попадания в область.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/FieldInterpolationResult'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /solver/characteristic-sets/{set_id}:
    get:
      tags: [Compute]
      summary: Сохранённый набор кривых
      description: Набор кривых по характеристике для перерисовки графиков GUI.
      operationId: getCharacteristicSet
      parameters:
        - name: set_id
          in: path
          required: true
          description: Идентификатор набора кривых.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Набор кривых.
          content:
            application/json:
              schema:
                $ref: 'schemas/compute.yaml#/CharacteristicSet'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'

# =============================================================================
# Devices · справочники D0 и конфигурация D1 (структуры, CAD-импорт, экспорт)
# =============================================================================
paths:
  /catalog/device-families:
    get:
      tags: [Catalog]
      summary: Справочник семейств приборов
      description: |
        Десять семейств с основным методом расчёта и целевым форматом экспорта
        (FR-EXP-01). Используется GUI для заполнения списка структур.
      operationId: listDeviceFamilies
      security: []
      responses:
        '200':
          description: Семейства приборов.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/common.yaml#/DeviceFamilyLabel'
  /catalog/geometry-fields:
    get:
      tags: [Catalog]
      summary: Поля геометрии семейства с диапазонами для GUI
      description: |
        Возвращает определения полей EAV и допустимые диапазоны
        (`GeometryRange`), по которым GUI перенастраивает QDoubleSpinBox.
      operationId: listGeometryFields
      parameters:
        - $ref: 'common/parameters.yaml#/DeviceFamilyQuery'
      responses:
        '200':
          description: Поля геометрии и их диапазоны.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/device.yaml#/GeometryFieldDefinition'
        '400':
          $ref: 'common/_responses.yaml#/BadRequest'
  /catalog/geometry-ranges:
    get:
      tags: [Catalog]
      summary: Диапазоны значений полей геометрии
      description: |
        Границы, значение по умолчанию и единицы для контроля ввода. Значения
        согласованы с инвариантами семейств (FR-CORE-01).
      operationId: listGeometryRanges
      parameters:
        - $ref: 'common/parameters.yaml#/DeviceFamilyQuery'
      responses:
        '200':
          description: Диапазоны значений.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/device.yaml#/GeometryRange'
  /catalog/materials:
    get:
      tags: [Catalog]
      summary: Справочник материалов слоёв
      operationId: listMaterials
      security: []
      responses:
        '200':
          description: Материалы (канал, оксид, барьер, подложка, электроды).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/device.yaml#/Material'
  /catalog/capabilities:
    get:
      tags: [Catalog]
      summary: Возможности семейства
      description: |
        Набор поддерживаемых методов, форматов экспорта и EDA-симуляторов.
        Определяет, какие кнопки GUI активны для выбранной структуры.
      operationId: getDeviceCapabilities
      parameters:
        - name: device_family
          in: query
          required: true
          description: Семейство прибора.
          schema:
            $ref: 'schemas/common.yaml#/DeviceFamily'
      responses:
        '200':
          description: Возможности семейства.
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/DeviceCapabilities'
        '400':
          $ref: 'common/_responses.yaml#/BadRequest'
  /profiles:
    get:
      tags: [Devices]
      summary: Профили конфигурации семейств
      operationId: listProfiles
      parameters:
        - $ref: 'common/parameters.yaml#/DeviceFamilyQuery'
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
      responses:
        '200':
          description: Страница профилей.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'schemas/common.yaml#/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: 'schemas/device.yaml#/Profile'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
  /profiles/{profile_id}:
    get:
      tags: [Devices]
      summary: Профиль по идентификатору
      operationId: getProfile
      parameters:
        - $ref: 'common/parameters.yaml#/ProfileIdPath'
      responses:
        '200':
          description: Профиль семейства.
          headers:
            ETag:
              $ref: 'common/headers.yaml#/headers/ETag'
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/Profile'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /structures:
    get:
      tags: [Devices]
      summary: Список структур
      description: |
        Краткие записи без геометрии и CAD-данных; полный набор параметров —
        через `/structures/{structure_id}` или `/structures/{structure_id}/export`.
      operationId: listStructures
      parameters:
        - $ref: 'common/parameters.yaml#/DeviceFamilyQuery'
        - $ref: 'common/parameters.yaml#/Search'
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
        - $ref: 'common/parameters.yaml#/Sort'
      responses:
        '200':
          description: Страница структур.
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/DeviceStructureList'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
    post:
      tags: [Devices]
      summary: Создать структуру
      description: |
        Параметрическая геометрия без STL. Проверяются обязательные поля семейства
        и инварианты (например, `fin_pitch_nm ≥ fin_width_nm`).
      operationId: createStructure
      parameters:
        - $ref: 'common/parameters.yaml#/IdempotencyKey'
        - $ref: 'common/parameters.yaml#/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/device.yaml#/DeviceStructureCreate'
      responses:
        '201':
          description: Структура создана.
          headers:
            Location:
              $ref: 'common/headers.yaml#/headers/Location'
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/DeviceStructure'
        '400':
          $ref: 'common/_responses.yaml#/BadRequest'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /structures/{structure_id}:
    get:
      tags: [Devices]
      summary: Структура с полным набором параметров
      operationId: getStructure
      parameters:
        - $ref: 'common/parameters.yaml#/StructureIdPath'
      responses:
        '200':
          description: Структура с физическими параметрами и геометрией.
          headers:
            ETag:
              $ref: 'common/headers.yaml#/headers/ETag'
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/DeviceStructure'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
    patch:
      tags: [Devices]
      summary: Частично обновить структуру
      description: |
        Требует `If-Match` с текущим `ETag`; изменение `device_id` запрещено —
        для другой геометрии создаётся новая структура.
      operationId: updateStructure
      parameters:
        - $ref: 'common/parameters.yaml#/StructureIdPath'
        - $ref: 'common/parameters.yaml#/IfMatch'
        - $ref: 'common/parameters.yaml#/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/device.yaml#/DeviceStructureUpdate'
      responses:
        '200':
          description: Обновлённая структура.
          headers:
            ETag:
              $ref: 'common/headers.yaml#/headers/ETag'
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/DeviceStructure'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '409':
          $ref: 'common/_responses.yaml#/Conflict'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
    delete:
      tags: [Devices]
      summary: Удалить структуру
      operationId: deleteStructure
      parameters:
        - $ref: 'common/parameters.yaml#/StructureIdPath'
        - $ref: 'common/parameters.yaml#/IfMatch'
      responses:
        '204':
          description: Структура удалена.
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '409':
          $ref: 'common/_responses.yaml#/Conflict'
  /structures/validate:
    post:
      tags: [Devices]
      summary: Проверка структуры без сохранения
      description: |
        Валидирует параметры и геометрию перед созданием: обязательные поля
        семейства, диапазоны `geometry_ranges`, инварианты и расчётные
        возможности. Возвращает ошибки по полям, а не задачу.
      operationId: validateStructure
      parameters:
        - $ref: 'common/parameters.yaml#/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/device.yaml#/DeviceStructureCreate'
      responses:
        '200':
          description: Результат проверки с токенами ошибок и предупреждениями.
          headers:
            X-Request-Id:
              $ref: 'common/headers.yaml#/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: 'schemas/common.yaml#/ValidationReport'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /structures/import-cad:
    post:
      tags: [Devices]
      summary: Импорт CAD-геометрии (STL)
      description: |
        Принимает STL (binary/ASCII) и метаданные. Сервер проверяет
        треугольники, единицы и ненулевой размер по всем осям (FR-IMP-02);
        при `await_mesh=true` синхронно строит предварительную сетку.
      operationId: importCadStructure
      parameters:
        - $ref: 'common/parameters.yaml#/XRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: 'schemas/device.yaml#/CadImportRequest'
                - type: object
                  required: [file]
                  properties:
                    file:
                      type: string
                      format: binary
                      description: Бинарный или текстовый STL-файл структуры.
      responses:
        '201':
          description: Структура создана из CAD-геометрии.
          headers:
            Location:
              $ref: 'common/headers.yaml#/headers/Location'
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/DeviceStructure'
        '400':
          $ref: 'common/_responses.yaml#/BadRequest'
        '413':
          $ref: 'common/_responses.yaml#/PayloadTooLarge'
        '415':
          description: Неподдерживаемый тип файла.
          content:
            application/problem+json:
              schema:
                $ref: 'common/errors.yaml#/Problem'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /structures/{structure_id}/cad:
    get:
      tags: [Devices]
      summary: Метаданные CAD-геометрии
      operationId: getStructureCadGeometry
      parameters:
        - $ref: 'common/parameters.yaml#/StructureIdPath'
      responses:
        '200':
          description: Метаданные STL (число треугольников, габариты, единицы).
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/StlGeometry'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /structures/{structure_id}/export:
    get:
      tags: [Devices]
      summary: Экспорт полного набора параметров
      description: |
        JSON-отчёт со структурой, профилем, настройками решателя и ссылками на
        последние расчёты (FR-IMP-03). Используется при переносе структуры.
      operationId: exportStructureParameters
      parameters:
        - $ref: 'common/parameters.yaml#/StructureIdPath'
      responses:
        '200':
          description: Полный набор параметров.
          content:
            application/json:
              schema:
                $ref: 'schemas/device.yaml#/ParameterSetExport'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'

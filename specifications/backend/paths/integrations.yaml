# =============================================================================
# Integrations · EDA-мосты и настройки подключения к симуляторам
# =============================================================================
paths:
  /integrations/eda:
    get:
      tags: [Integrations]
      summary: Настройки подключения к EDA-симуляторам
      description: |
        Пути к ngspice, Micro-Cap CLI, OpenVAF и признак доступности Tanner
        T-Spice (NFR-COM-01). Секреты не возвращаются.
      operationId: listEdaIntegrations
      responses:
        '200':
          description: Список настроек по симуляторам.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/verification.yaml#/EdaIntegration'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
  /integrations/eda/{simulator}:
    put:
      tags: [Integrations]
      summary: Обновить настройки симулятора
      description: |
        Меняет путь к исполняемому файлу и параметры запуска. Доступно роли
        `admin`; после сохранения выполняется проверка запуска.
      operationId: updateEdaIntegration
      parameters:
        - name: simulator
          in: path
          required: true
          description: Целевой симулятор.
          schema:
            $ref: 'schemas/verification.yaml#/EdaSimulator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executable_path]
              properties:
                executable_path:
                  type: string
                  maxLength: 512
                timeout_s:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  default: 300
      responses:
        '200':
          description: Сохранённые настройки и результат проверки.
          content:
            application/json:
              schema:
                $ref: 'schemas/verification.yaml#/EdaIntegration'
        '403':
          $ref: 'common/_responses.yaml#/Forbidden'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
    delete:
      tags: [Integrations]
      summary: Сбросить настройки симулятора
      description: Возвращает пустой путь; операции с симулятором становятся недоступны.
      operationId: resetEdaIntegration
      parameters:
        - name: simulator
          in: path
          required: true
          description: Целевой симулятор.
          schema:
            $ref: 'schemas/verification.yaml#/EdaSimulator'
      responses:
        '204':
          description: Настройки сброшены.
        '403':
          $ref: 'common/_responses.yaml#/Forbidden'
  /integrations/eda/{simulator}/check:
    post:
      tags: [Integrations]
      summary: Проверить доступность симулятора
      description: |
        Запускает симулятор с тестовой командой и сообщает версию или причину
        недоступности (`EDA_TOOL_UNAVAILABLE`).
      operationId: checkEdaIntegration
      parameters:
        - name: simulator
          in: path
          required: true
          description: Целевой симулятор.
          schema:
            $ref: 'schemas/verification.yaml#/EdaSimulator'
      responses:
        '200':
          description: Результат проверки.
          content:
            application/json:
              schema:
                $ref: 'schemas/verification.yaml#/EdaIntegration'
        '503':
          $ref: 'common/_responses.yaml#/ServiceUnavailable'

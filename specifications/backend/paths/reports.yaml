# =============================================================================
# Reports · LaTeX-отчёт и выгрузка PDF (NFR-USA-01)
# =============================================================================
paths:
  /reports:
    get:
      tags: [Reports]
      summary: Список отчётов
      operationId: listReports
      parameters:
        - name: structure_id
          in: query
          description: Фильтр по структуре.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: 'common/parameters.yaml#/StatusQuery'
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
      responses:
        '200':
          description: Страница отчётов.
          content:
            application/json:
              schema:
                $ref: 'schemas/verification.yaml#/ReportList'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
    post:
      tags: [Reports]
      summary: Сгенерировать LaTeX-отчёт
      description: |
        Собирает финальные таблицы параметров, графики наложения кривых и журнал
        верификации; компиляция PDF выполняется асинхронно (юнит `report`).
      operationId: createReport
      parameters:
        - $ref: 'common/parameters.yaml#/IdempotencyKey'
        - $ref: 'common/parameters.yaml#/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/verification.yaml#/ReportRequest'
      responses:
        '202':
          description: Задача генерации отчёта принята.
          content:
            application/json:
              schema:
                $ref: 'schemas/verification.yaml#/Report'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
        '503':
          $ref: 'common/_responses.yaml#/ServiceUnavailable'
  /reports/{report_id}:
    get:
      tags: [Reports]
      summary: Отчёт с LaTeX-исходником
      operationId: getReport
      parameters:
        - $ref: 'common/parameters.yaml#/ReportIdPath'
      responses:
        '200':
          description: Метаданные отчёта и исходник LaTeX.
          content:
            application/json:
              schema:
                $ref: 'schemas/verification.yaml#/Report'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /reports/{report_id}/download:
    get:
      tags: [Reports]
      summary: Скачать PDF отчёта
      operationId: downloadReport
      parameters:
        - $ref: 'common/parameters.yaml#/ReportIdPath'
      responses:
        '200':
          description: Скомпилированный PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '409':
          $ref: 'common/_responses.yaml#/Conflict'

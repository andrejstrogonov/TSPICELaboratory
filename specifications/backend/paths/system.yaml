# =============================================================================
# System · health, версия контракта, журнал задач и SSE-поток прогресса
# =============================================================================
paths:
  /health:
    get:
      tags: [System]
      summary: Состояние сервиса и его зависимостей
      description: |
        Возвращает агрегированный статус БД, хранилища, CUDA, EDA-инструментов и
        LaTeX. Используется Jenkins-доставкой и GUI для индикатора доступности.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Сервис отвечает, статус каждой зависимости в `checks`.
          content:
            application/json:
              schema:
                $ref: 'schemas/common.yaml#/HealthStatus'
        '503':
          $ref: 'common/_responses.yaml#/ServiceUnavailable'
  /version:
    get:
      tags: [System]
      summary: Версия контракта API
      operationId: getApiVersion
      security: []
      responses:
        '200':
          description: Версия API и хеш контракта для проверки совместимости GUI.
          content:
            application/json:
              schema:
                type: object
                required: [api_version, contract_version]
                properties:
                  api_version:
                    type: string
                    examples: ['v1']
                  contract_version:
                    type: string
                    examples: ['1.0.0']
                  git_commit:
                    type: string
  /jobs:
    get:
      tags: [System]
      summary: Журнал фоновых задач
      description: |
        Задачи расчёта, экстракции, верификации и обучения. Терминальные задачи
        хранятся NFR-REL-05 и доступны для повторного просмотра результата.
      operationId: listJobs
      parameters:
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
        - $ref: 'common/parameters.yaml#/Sort'
        - $ref: 'common/parameters.yaml#/SinceStream'
        - name: kind
          in: query
          description: Фильтр по типу операции.
          schema:
            $ref: 'schemas/common.yaml#/JobKind'
        - name: status
          in: query
          description: Фильтр по состоянию задачи.
          schema:
            $ref: 'schemas/common.yaml#/JobStatus'
      responses:
        '200':
          description: Страница журнала задач.
          content:
            application/json:
              schema:
                $ref: 'schemas/common.yaml#/JobList'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
  /jobs/{job_id}:
    get:
      tags: [System]
      summary: Состояние задачи
      operationId: getJob
      parameters:
        - $ref: 'common/parameters.yaml#/JobIdPath'
        - $ref: 'common/parameters.yaml#/XRequestId'
      responses:
        '200':
          description: Задача с текущим прогрессом и ссылками на результаты.
          content:
            application/json:
              schema:
                $ref: 'schemas/common.yaml#/Job'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
    delete:
      tags: [System]
      summary: Отменить задачу
      description: |
        Публикует `cancel_requested`; задача переходит в `cancelled`, если
        решатель ещё не завершил текущий этап.
      operationId: cancelJob
      parameters:
        - $ref: 'common/parameters.yaml#/JobIdPath'
        - $ref: 'common/parameters.yaml#/XRequestId'
      responses:
        '202':
          description: Запрос на отмену принят.
          content:
            application/json:
              schema:
                $ref: 'schemas/common.yaml#/Job'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '409':
          $ref: 'common/_responses.yaml#/Conflict'
  /jobs/{job_id}/events:
    get:
      tags: [System]
      summary: Поток прогресса задачи (SSE)
      description: |
        `text/event-stream` с событием `progress` на каждый этап и событием
        `done` в терминальном состоянии. Соединение закрывается сервером после
        `done`; клиент может переподключиться с `Last-Event-ID`.
      operationId: streamJobEvents
      parameters:
        - $ref: 'common/parameters.yaml#/JobIdPath'
        - name: Last-Event-ID
          in: header
          description: Идентификатор последнего полученного события (переподключение).
          schema:
            type: string
        - $ref: 'common/parameters.yaml#/XRequestId'
      responses:
        '200':
          description: Поток событий задачи.
          headers:
            X-Request-Id:
              $ref: 'common/headers.yaml#/headers/X-Request-Id'
          content:
            text/event-stream:
              schema:
                $ref: 'schemas/common.yaml#/JobEvent'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'

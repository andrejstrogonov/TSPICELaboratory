# =============================================================================
# AI · реестр суррогатов, обучение, инференс warm start, ONNX-экспорт и гейты
# =============================================================================
paths:
  /ai/surrogates:
    get:
      tags: [AI]
      summary: Реестр суррогатных моделей
      operationId: listSurrogates
      parameters:
        - name: family
          in: query
          description: Назначение суррогата.
          required: false
          schema:
            $ref: 'schemas/ai.yaml#/SurrogateFamily'
        - name: status
          in: query
          description: Состояние модели в реестре.
          required: false
          schema:
            type: string
            enum:
              - draft
              - validating
              - active
              - archived
              - failed
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
      responses:
        '200':
          description: Страница моделей.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/SurrogateModelList'
        '401':
          $ref: 'common/_responses.yaml#/Unauthorized'
    post:
      tags: [AI]
      summary: Зарегистрировать суррогатную модель
      description: |
        Создаёт запись в реестре в состоянии `draft`. Модель становится `active`
        только после прохождения гейтов (`/ai/surrogates/{surrogate_id}/gates`).
      operationId: registerSurrogate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/ai.yaml#/SurrogateModelCreate'
      responses:
        '201':
          description: Модель зарегистрирована.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/SurrogateModel'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /ai/surrogates/{surrogate_id}:
    get:
      tags: [AI]
      summary: Суррогатная модель
      operationId: getSurrogate
      parameters:
        - $ref: 'common/parameters.yaml#/SurrogateModelIdPath'
      responses:
        '200':
          description: Запись реестра.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/SurrogateModel'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /ai/surrogates/{surrogate_id}/train:
    post:
      tags: [AI]
      summary: Запустить обучение
      description: |
        Обучение на накопленных эталонных прогонах FEM (NFR-REL-04). Выполняется
        асинхронно; прогресс — через job events.
      operationId: startTraining
      parameters:
        - $ref: 'common/parameters.yaml#/SurrogateModelIdPath'
        - $ref: 'common/parameters.yaml#/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/ai.yaml#/TrainingRequest'
      responses:
        '202':
          description: Обучение поставлено в очередь.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/TrainingAccepted'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /ai/trainings:
    get:
      tags: [AI]
      summary: Журнал прогонов обучения
      operationId: listTrainingRuns
      parameters:
        - name: surrogate_id
          in: query
          description: Фильтр по модели.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: 'common/parameters.yaml#/StatusQuery'
        - $ref: 'common/parameters.yaml#/Page'
        - $ref: 'common/parameters.yaml#/PageSize'
      responses:
        '200':
          description: Страница прогонов обучения.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/TrainingRunList'
  /ai/trainings/{training_id}:
    get:
      tags: [AI]
      summary: Прогон обучения
      operationId: getTrainingRun
      parameters:
        - $ref: 'common/parameters.yaml#/TrainingRunIdPath'
      responses:
        '200':
          description: Прогон с метриками по эпохам.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/TrainingRun'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /ai/inference:
    post:
      tags: [AI]
      summary: Пробный инференс warm start
      description: |
        Инференс суррогата без записи в задачу расчёта. С `compare_with_fem`
        возвращает невязку тёплого старта относительно точного FEM.
      operationId: runSurrogateInference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/ai.yaml#/InferenceRequest'
      responses:
        '200':
          description: Результат инференса и сравнение с FEM.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/InferenceResult'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
  /ai/surrogates/{surrogate_id}/gates:
    get:
      tags: [AI]
      summary: Отчёт о проверках-гейтах модели
      description: |
        Физическая невязка, монотонность ВАХ, C²-непрерывность и экономия
        итераций. Без пройденных гейтов модель не может стать `active`.
      operationId: getSurrogateGates
      parameters:
        - $ref: 'common/parameters.yaml#/SurrogateModelIdPath'
      responses:
        '200':
          description: Отчёт о гейтах.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/ModelGateReport'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
  /ai/surrogates/{surrogate_id}/onnx:
    post:
      tags: [AI]
      summary: Экспорт модели в ONNX
      description: |
        Выгружает модель для Rust-ядра (ONNX Runtime). Возвращает результат
        проверки паритета «ONNX ≈ PyTorch».
      operationId: exportSurrogateOnnx
      parameters:
        - $ref: 'common/parameters.yaml#/SurrogateModelIdPath'
      responses:
        '200':
          description: Результат экспорта.
          content:
            application/json:
              schema:
                $ref: 'schemas/ai.yaml#/OnnxExportResult'
        '404':
          $ref: 'common/_responses.yaml#/NotFound'
        '422':
          $ref: 'common/_responses.yaml#/UnprocessableEntity'
